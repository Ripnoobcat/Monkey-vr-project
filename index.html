<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monkey Arena V1</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    #menu {
      position: fixed;
      top: 15px;
      left: 15px;
      z-index: 10;
      background: rgba(0,0,0,.75);
      color: white;
      padding: 14px;
      border-radius: 15px;
      width: 190px;
    }

    #menu h2 {
      margin: 0 0 10px;
      font-size: 20px;
    }

    button {
      width: 100%;
      margin: 5px 0;
      padding: 10px;
      border: 0;
      border-radius: 10px;
      font-weight: bold;
      background: #333;
      color: white;
    }

    button.on {
      background: #16a34a;
    }

    #score {
      margin-top: 8px;
      font-size: 16px;
    }

    #jump {
      position: fixed;
      right: 20px;
      bottom: 25px;
      z-index: 20;
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: #7c3aed;
      color: white;
      font-size: 18px;
    }
  </style>
</head>

<body>

<div id="menu">
  <h2>🦍 MONKEY ARENA</h2>

  <button id="speedBtn">⚡ Speed: OFF</button>
  <button id="jumpBtn">🦘 Super Jump: OFF</button>

  <div id="score">🍌 Bananas: 0</div>
</div>

<button id="jump">JUMP</button>

<a-scene
  background="color: #10151b"
  vr-mode-ui="enabled: true"
  renderer="colorManagement: true">

  <!-- LIGHTING -->
  <a-light type="ambient" intensity="1"></a-light>
  <a-light
    type="directional"
    intensity="1.5"
    position="5 10 5">
  </a-light>

  <!-- PLAYER -->
  <a-entity
    id="player"
    position="0 1.6 8"
    wasd-controls="acceleration: 25"
    look-controls>

    <a-camera></a-camera>

    <!-- Left hand -->
    <a-entity
      laser-controls="hand: left"
      raycaster="objects: .clickable">
    </a-entity>

    <!-- Right hand -->
    <a-entity
      laser-controls="hand: right"
      raycaster="objects: .clickable">
    </a-entity>

  </a-entity>

  <!-- FLOOR -->
  <a-plane
    rotation="-90 0 0"
    width="50"
    height="50"
    color="#293241">
  </a-plane>

  <!-- START PLATFORM -->
  <a-box
    position="0 .5 8"
    width="8"
    height="1"
    depth="8"
    color="#4b5563">
  </a-box>

  <!-- PLATFORMS -->
  <a-box position="-7 2 0" width="5" height="1" depth="5" color="#6366f1"></a-box>
  <a-box position="7 3 -5" width="5" height="1" depth="5" color="#ec4899"></a-box>
  <a-box position="-5 4 -9" width="5" height="1" depth="5" color="#22c55e"></a-box>
  <a-box position="5 5 -15" width="5" height="1" depth="5" color="#f59e0b"></a-box>

  <!-- WALLS -->
  <a-box position="-12 2 -5" width="1" height="4" depth="30" color="#374151"></a-box>
  <a-box position="12 2 -5" width="1" height="4" depth="30" color="#374151"></a-box>

  <!-- BANANAS -->
  <a-entity class="banana" position="-7 3 0">
    <a-torus
      radius="0.35"
      radius-tubular="0.12"
      rotation="90 0 0"
      color="#facc15">
    </a-torus>
  </a-entity>

  <a-entity class="banana" position="7 4 -5">
    <a-torus
      radius="0.35"
      radius-tubular="0.12"
      rotation="90 0 0"
      color="#facc15">
    </a-torus>
  </a-entity>

  <a-entity class="banana" position="-5 5 -9">
    <a-torus
      radius="0.35"
      radius-tubular="0.12"
      rotation="90 0 0"
      color="#facc15">
    </a-torus>
  </a-entity>

  <a-entity class="banana" position="5 6 -15">
    <a-torus
      radius="0.35"
      radius-tubular="0 0"
      color="#facc15">
    </a-torus>
  </a-entity>

  <!-- TREES -->
  <a-cylinder
    position="-10 3 -10"
    radius="1"
    height="6"
    color="#78350f">
  </a-cylinder>

  <a-sphere
    position="-10 7 -10"
    radius="3"
    color="#15803d">
  </a-sphere>

  <a-cylinder
    position="10 3 -18"
    radius="1"
    height="6"
    color="#78350f">
  </a-cylinder>

  <a-sphere
    position="10 7 -18"
    radius="3"
    color="#15803d">
  </a-sphere>

</a-scene>

<script>
  const player = document.getElementById("player");
  const speedBtn = document.getElementById("speedBtn");
  const jumpBtn = document.getElementById("jumpBtn");
  const jumpButton = document.getElementById("jump");
  const scoreText = document.getElementById("score");

  let speedOn = false;
  let superJump = false;
  let bananas = 0;
  let jumping = false;

  speedBtn.onclick = () => {
    speedOn = !speedOn;

    speedBtn.textContent =
      speedOn ? "⚡ Speed: ON" : "⚡ Speed: OFF";

    speedBtn.classList.toggle("on", speedOn);

    player.setAttribute(
      "wasd-controls",
      "acceleration",
      speedOn ? 80 : 25
    );
  };

  jumpBtn.onclick = () => {
    superJump = !superJump;

    jumpBtn.textContent =
      superJump ? "🦘 Super Jump: ON" : "🦘 Super Jump: OFF";

    jumpBtn.classList.toggle("on", superJump);
  };

  function jump() {
    if (jumping) return;

    jumping = true;

    const startY = player.object3D.position.y;
    const height = superJump ? 5 : 2;
    const duration = superJump ? 650 : 450;

    let start = null;

    function animate(time) {
      if (!start) start = time;

      const progress = (time - start) / duration;

      if (progress < 1) {
        const y = startY + Math.sin(progress * Math.PI) * height;
        player.object3D.position.y = y;
        requestAnimationFrame(animate);
      } else {
        player.object3D.position.y = startY;
        jumping = false;
      }
    }

    requestAnimationFrame(animate);
  }

  jumpButton.onclick = jump;

  document.addEventListener("keydown", e => {
    if (e.code === "Space") jump();
  });

  // Banana collection
  document.querySelectorAll(".banana").forEach(banana => {
    banana.addEventListener("click", () => {
      banana.setAttribute("visible", "false");

      bananas++;
      scoreText.textContent = "🍌 Bananas: " + bananas;
    });
  });

  // Rotate bananas
  setInterval(() => {
    document.querySelectorAll(".banana").forEach(banana => {
      banana.object3D.rotation.y += 0.08;
    });
  }, 30);
</script>

</body>
</html>

      /* =========================================================
   MONKEY VR — ORIGINAL ARM-SWING LOCOMOTION
   Quest 3S controllers + hand tracking foundation
   ========================================================= */

(function () {
  "use strict";

  const rig =
    document.querySelector("#rig") ||
    document.querySelector("#playerRig");

  const scene =
    document.querySelector("a-scene");

  if (!rig || !scene) {
    console.warn(
      "Arm locomotion: player rig or scene not found."
    );
    return;
  }

  const state = {
    enabled: true,

    velocity: {
      x: 0,
      y: 0,
      z: 0
    },

    left: {
      position: { x: 0, y: 0, z: 0 },
      previous: { x: 0, y: 0, z: 0 },
      velocity: { x: 0, y: 0, z: 0 },
      touching: false
    },

    right: {
      position: { x: 0, y: 0, z: 0 },
      previous: { x: 0, y: 0, z: 0 },
      velocity: { x: 0, y: 0, z: 0 },
      touching: false
    },

    grounded: false,

    gravity: -8.5,

    pushStrength: 2.2,

    maxSpeed: 7.0,

    friction: 0.88,

    airFriction: 0.985,

    jumpBoost: 3.0,

    handRadius: 0.16,

    lastTime: performance.now()
  };

  /* -------------------------------------------------------
     HELPERS
     ------------------------------------------------------- */

  function clamp(v, min, max) {
    return Math.max(
      min,
      Math.min(max, v)
    );
  }

  function length(v) {
    return Math.sqrt(
      v.x * v.x +
      v.y * v.y +
      v.z * v.z
    );
  }

  function copy(a) {
    return {
      x: a.x,
      y: a.y,
      z: a.z
    };
  }

  function subtract(a, b) {
    return {
      x: a.x - b.x,
      y: a.y - b.y,
      z: a.z - b.z
    };
  }

  function add(a, b) {
    return {
      x: a.x + b.x,
      y: a.y + b.y,
      z: a.z + b.z
    };
  }

  function multiply(v, n) {
    return {
      x: v.x * n,
      y: v.y * n,
      z: v.z * n
    };
  }

  /* -------------------------------------------------------
     GET WORLD POSITION
     ------------------------------------------------------- */

  function worldPosition(entity) {
    if (
      !entity ||
      !entity.object3D
    ) {
      return null;
    }

    const p =
      new THREE.Vector3();

    entity.object3D.getWorldPosition(
      p
    );

    return {
      x: p.x,
      y: p.y,
      z: p.z
    };
  }

  /* -------------------------------------------------------
     FIND HANDS
     ------------------------------------------------------- */

  function findHand(side) {
    const selectors =
      side === "left"
        ? [
            "#leftHand",
            "#hand-left",
            "[hand-controls='left']",
            "[oculus-touch-controls='hand: left']",
            "[laser-controls='hand: left']"
          ]
        : [
            "#rightHand",
            "#hand-right",
            "[hand-controls='right']",
            "[oculus-touch-controls='hand: right']",
            "[laser-controls='hand: right']"
          ];

    for (
      const selector of selectors
    ) {
      const found =
        document.querySelector(
          selector
        );

      if (found) {
        return found;
      }
    }

    return null;
  }

  let leftHand =
    findHand("left");

  let rightHand =
    findHand("right");

  /* -------------------------------------------------------
     CONTROLLER FALLBACK
     ------------------------------------------------------- */

  function discoverHands() {
    if (!leftHand) {
      leftHand =
        findHand("left");
    }

    if (!rightHand) {
      rightHand =
        findHand("right");
    }

    /*
     * Look for generic controller
     * entities if the project uses
     * different IDs.
     */

    if (
      !leftHand ||
      !rightHand
    ) {
      const candidates =
        Array.from(
          scene.querySelectorAll(
            "[laser-controls],[hand-controls],[oculus-touch-controls]"
          )
        );

      for (
        const entity of candidates
      ) {
        const text =
          (
            entity.id +
            " " +
            JSON.stringify(
              entity.getAttribute(
                "laser-controls"
              ) || {}
            ) +
            " " +
            JSON.stringify(
              entity.getAttribute(
                "hand-controls"
              ) || {}
            )
          ).toLowerCase();

        if (
          text.includes("left") &&
          !leftHand
        ) {
          leftHand =
            entity;
        }

        if (
          text.includes("right") &&
          !rightHand
        ) {
          rightHand =
            entity;
        }
      }
    }
  }

  /* -------------------------------------------------------
     HAND VELOCITY
     ------------------------------------------------------- */

  function updateHand(
    handState,
    entity,
    dt
  ) {
    if (!entity) {
      handState.touching =
        false;
      return;
    }

    const p =
      worldPosition(entity);

    if (!p) {
      handState.touching =
        false;
      return;
    }

    handState.previous =
      copy(
        handState.position
      );

    handState.position =
      p;

    if (dt > 0) {
      handState.velocity =
        multiply(
          subtract(
            handState.position,
            handState.previous
          ),
          1 / dt
        );
    }

    /*
     * Very high values can happen
     * when tracking jumps suddenly.
     * Clamp them so one tracking
     * glitch doesn't launch the player.
     */

    const speed =
      length(
        handState.velocity
      );

    if (speed > 12) {
      handState.velocity =
        multiply(
          handState.velocity,
          12 / speed
        );
    }
  }

  /* -------------------------------------------------------
     SIMPLE SURFACE DETECTION
     ------------------------------------------------------- */

  function isNearGround(p) {
    if (!p) return false;

    return (
      p.y <= 0.35
    );
  }

  function isNearObject(
    handPosition
  ) {
    if (!handPosition) {
      return false;
    }

    /*
     * Use a conservative collision
     * check against visible static
     * objects in the world.
     */

    const objects =
      scene.querySelectorAll(
        "[data-collidable]"
      );

    for (
      const object of objects
    ) {
      if (
        !object.object3D
      ) {
        continue;
      }

      const p =
        worldPosition(
          object
        );

      if (!p) continue;

      const dx =
        handPosition.x -
        p.x;

      const dy =
        handPosition.y -
        p.y;

      const dz =
        handPosition.z -
        p.z;

      const distance =
        Math.sqrt(
          dx * dx +
          dy * dy +
          dz * dz
        );

      if (
        distance <
        0.65
      ) {
        return true;
      }
    }

    return false;
  }

  /* -------------------------------------------------------
     ARM PUSH
     ------------------------------------------------------- */

  function applyHandPush(
    handState,
    dt
  ) {
    if (!handState) {
      return;
    }

    const movement =
      handState.velocity;

    const speed =
      length(movement);

    if (
      speed < 0.08
    ) {
      return;
    }

    /*
     * Moving your hand backwards
     * creates forward body movement.
     *
     * This is intentionally an
     * original implementation rather
     * than copied game code.
     */

    const push =
      multiply(
        movement,
        -state.pushStrength
      );

    state.velocity.x +=
      push.x * dt;

    state.velocity.y +=
      push.y * dt;

    state.velocity.z +=
      push.z * dt;
  }

  /* -------------------------------------------------------
     GROUND PUSH
     ------------------------------------------------------- */

  function applyGroundPush(
    handState
  ) {
    if (!handState) {
      return;
    }

    const p =
      handState.position;

    if (
      !isNearGround(p)
    ) {
      return;
    }

    const handSpeed =
      length(
        handState.velocity
      );

    if (
      handSpeed < 1.0
    ) {
      return;
    }

    /*
     * Strong downward hand movement
     * can launch the player upward.
     */

    if (
      handState.velocity.y <
      -1.2
    ) {
      state.velocity.y +=
        Math.min(
          -handState.velocity.y *
          0.45,
          state.jumpBoost
        );
    }
  }

  /* -------------------------------------------------------
     WALL / OBJECT PUSH
     ------------------------------------------------------- */

  function applySurfacePush(
    handState,
    dt
  ) {
    if (!handState) {
      return;
    }

    if (
      !isNearObject(
        handState.position
      )
    ) {
      return;
    }

    const movement =
      handState.velocity;

    const speed =
      length(movement);

    if (
      speed < 0.25
    ) {
      return;
    }

    state.velocity.x +=
      -movement.x *
      state.pushStrength *
      dt;

    state.velocity.y +=
      -movement.y *
      state.pushStrength *
      dt;

    state.velocity.z +=
      -movement.z *
      state.pushStrength *
      dt;
  }

  /* -------------------------------------------------------
     APPLY PLAYER MOVEMENT
     ------------------------------------------------------- */

  function movePlayer(dt) {
    const p =
      rig.object3D.position;

    if (!p) {
      return;
    }

    /*
     * Gravity.
     */

    if (
      !state.grounded
    ) {
      state.velocity.y +=
        state.gravity *
        dt;
    }

    /*
     * Limit total speed.
     */

    const horizontalSpeed =
      Math.sqrt(
        state.velocity.x *
          state.velocity.x +
        state.velocity.z *
          state.velocity.z
      );

    if (
      horizontalSpeed >
      state.maxSpeed
    ) {
      const scale =
        state.maxSpeed /
        horizontalSpeed;

      state.velocity.x *=
        scale;

      state.velocity.z *=
        scale;
    }

    /*
     * Move body.
     */

    p.x +=
      state.velocity.x *
      dt;

    p.y +=
      state.velocity.y *
      dt;

    p.z +=
      state.velocity.z *
      dt;

    /*
     * Ground collision.
     */

    const ground =
      0;

    if (
      p.y <= ground
    ) {
      p.y =
        ground;

      if (
        state.velocity.y <
        0
      ) {
        state.velocity.y =
          0;
      }

      state.grounded =
        true;
    } else {
      state.grounded =
        false;
    }

    /*
     * Friction.
     */

    const friction =
      state.grounded
        ? state.friction
        : state.airFriction;

    state.velocity.x *=
      Math.pow(
        friction,
        dt * 60
      );

    state.velocity.z *=
      Math.pow(
        friction,
        dt * 60
      );
  }

  /* -------------------------------------------------------
     MAIN LOOP
     ------------------------------------------------------- */

  function armMovementLoop(now) {
    const dt =
      Math.min(
        Math.max(
          (now -
            state.lastTime) /
            1000,
          0.001
        ),
        0.05
      );

    state.lastTime =
      now;

    discoverHands();

    updateHand(
      state.left,
      leftHand,
      dt
    );

    updateHand(
      state.right,
      rightHand,
      dt
    );

    if (
      state.enabled
    ) {
      applyHandPush(
        state.left,
        dt
      );

      applyHandPush(
        state.right,
        dt
      );

      applyGroundPush(
        state.left
      );

      applyGroundPush(
        state.right
      );

      applySurfacePush(
        state.left,
        dt
      );

      applySurfacePush(
        state.right,
        dt
      );

      movePlayer(dt);
    }

    requestAnimationFrame(
      armMovementLoop
    );
  }

  /* -------------------------------------------------------
     KEYBOARD TEST MODE
     ------------------------------------------------------- */

  const keys = {};

  window.addEventListener(
    "keydown",
    event => {
      keys[
        event.key.toLowerCase()
      ] = true;
    }
  );

  window.addEventListener(
    "keyup",
    event => {
      keys[
        event.key.toLowerCase()
      ] = false;
    }
  );

  /*
   * PC fallback:
   * hold W/S/A/D to push the
   * virtual body around.
   */

  function keyboardFallback(
    dt
  ) {
    if (
      !keys.w &&
      !keys.a &&
      !keys.s &&
      !keys.d
    ) {
      return;
    }

    const x =
      (keys.d ? 1 : 0) -
      (keys.a ? 1 : 0);

    const z =
      (keys.s ? 1 : 0) -
      (keys.w ? 1 : 0);

    state.velocity.x +=
      x *
      3 *
      dt;

    state.velocity.z +=
      z *
      3 *
      dt;

    if (
      keys[" "] &&
      state.grounded
    ) {
      state.velocity.y =
        4.2;
    }
  }

  /*
   * Add keyboard fallback to
   * movement without replacing
   * arm locomotion.
   */

  const originalMove =
    movePlayer;

  function combinedMovement(dt) {
    keyboardFallback(dt);

    originalMove(dt);
  }

  /*
   * Replace internal movement
   * reference by wrapping the
   * animation loop.
   */

  function combinedLoop(now) {
    const dt =
      Math.min(
        Math.max(
          (now -
            state.lastTime) /
            1000,
          0.001
        ),
        0.05
      );

    state.lastTime =
      now;

    discoverHands();

    updateHand(
      state.left,
      leftHand,
      dt
    );

    updateHand(
      state.right,
      rightHand,
      dt
    );

    if (
      state.enabled
    ) {
      applyHandPush(
        state.left,
        dt
      );

      applyHandPush(
        state.right,
        dt
      );

      applyGroundPush(
        state.left
      );

      applyGroundPush(
        state.right
      );

      applySurfacePush(
        state.left,
        dt
      );

      applySurfacePush(
        state.right,
        dt
      );

      keyboardFallback(
        dt
      );

      originalMove(
        dt
      );
    }

    requestAnimationFrame(
      combinedLoop
    );
  }

  /* -------------------------------------------------------
     PUBLIC API
     ------------------------------------------------------- */

  window.MonkeyVRArmMovement = {

    state,

    enable() {
      state.enabled =
        true;
    },

    disable() {
      state.enabled =
        false;

      state.velocity.x =
        0;

      state.velocity.y =
        0;

      state.velocity.z =
        0;
    },

    reset() {
      state.velocity.x =
        0;

      state.velocity.y =
        0;

      state.velocity.z =
        0;

      rig.object3D.position.y =
        0;
    },

    setPushStrength(value) {
      state.pushStrength =
        clamp(
          Number(value) || 2.2,
          0.2,
          6
        );
    },

    setMaxSpeed(value) {
      state.maxSpeed =
        clamp(
          Number(value) || 7,
          1,
          15
        );
    },

    getVelocity() {
      return copy(
        state.velocity
      );
    }
  };

  console.log(
    "🐒 Original arm-swing locomotion loaded!"
  );

  requestAnimationFrame(
    combinedLoop
  );

})();
      /* =========================================================
   MONKEY VR — QUEST 3S MOVEMENT FIX
   ========================================================= */

(function () {
  "use strict";

  const rig =
    document.querySelector("#rig") ||
    document.querySelector("#playerRig");

  const scene =
    document.querySelector("a-scene");

  if (!rig || !scene) {
    console.warn(
      "Monkey VR movement fix: player rig or scene not found."
    );
    return;
  }

  let leftX = 0;
  let leftY = 0;

  let rightX = 0;
  let rightY = 0;

  const SPEED = 2.8;

  function getPosition() {
    return rig.object3D.position;
  }

  function getCamera() {
    return (
      document.querySelector("[camera]") ||
      document.querySelector("#camera")
    );
  }

  function updateStick(axis, value) {
    const v =
      Number(value);

    if (!Number.isFinite(v)) {
      return;
    }

    if (axis === "leftX") {
      leftX = v;
    }

    if (axis === "leftY") {
      leftY = v;
    }

    if (axis === "rightX") {
      rightX = v;
    }

    if (axis === "rightY") {
      rightY = v;
    }
  }

  function handleThumbstick(event) {
    const detail =
      event.detail || {};

    const axis =
      detail.axis;

    if (
      Array.isArray(axis) &&
      axis.length >= 2
    ) {
      /*
       * A-Frame commonly reports
       * thumbstick axes as:
       *
       * [horizontal, vertical]
       */

      const x =
        Number(axis[0]) || 0;

      const y =
        Number(axis[1]) || 0;

      const controller =
        event.target;

      const hand =
        controller?.getAttribute(
          "hand-controls"
        ) ||
        controller?.getAttribute(
          "oculus-touch-controls"
        ) ||
        controller?.getAttribute(
          "meta-touch-controls"
        );

      const id =
        controller?.id ||
        "";

      const isLeft =
        String(id)
          .toLowerCase()
          .includes("left") ||
        String(hand)
          .toLowerCase()
          .includes("left");

      if (isLeft) {
        leftX = x;
        leftY = y;
      } else {
        rightX = x;
        rightY = y;
      }
    }
  }

  /*
   * Listen for several common A-Frame
   * controller events.
   */

  [
    "thumbstickmoved",
    "axismove"
  ].forEach(
    eventName => {
      scene.addEventListener(
        eventName,
        handleThumbstick
      );
    }
  );

  function movePlayer(dt) {
    const position =
      getPosition();

    if (!position) {
      return;
    }

    /*
     * Deadzone prevents controller
     * stick drift.
     */

    const deadzone =
      0.15;

    let x =
      Math.abs(leftX) >
      deadzone
        ? leftX
        : 0;

    let y =
      Math.abs(leftY) >
      deadzone
        ? leftY
        : 0;

    if (
      x === 0 &&
      y === 0
    ) {
      return;
    }

    const camera =
      getCamera();

    let forwardX = 0;
    let forwardZ = -1;

    let rightX = 1;
    let rightZ = 0;

    if (
      camera &&
      camera.object3D
    ) {
      const rotation =
        camera.object3D.rotation.y;

      forwardX =
        -Math.sin(rotation);

      forwardZ =
        -Math.cos(rotation);

      rightX =
        Math.cos(rotation);

      rightZ =
        -Math.sin(rotation);
    }

    /*
     * Stick forward/backward.
     */

    position.x +=
      (
        rightX * x +
        forwardX * -y
      ) *
      SPEED *
      dt;

    position.z +=
      (
        rightZ * x +
        forwardZ * -y
      ) *
      SPEED *
      dt;
  }

  let last =
    performance.now();

  function movementLoop(now) {
    const dt =
      Math.min(
        (now - last) / 1000,
        0.05
      );

    last =
      now;

    movePlayer(dt);

    requestAnimationFrame(
      movementLoop
    );
  }

  requestAnimationFrame(
    movementLoop
  );

  /*
   * Expose a small API so the rest
   * of Monkey VR can use this movement.
   */

  window.MonkeyVRQuestMovement = {
    getStickState() {
      return {
        leftX,
        leftY,
        rightX,
        rightY
      };
    },

    stop() {
      leftX = 0;
      leftY = 0;
      rightX = 0;
      rightY = 0;
    }
  };

  console.log(
    "🐒 Quest 3S movement fix loaded!"
  );

})();
      /* =========================================================
   MONKEY VR — GROUND / SPAWN FIX
   ========================================================= */

(function () {
  "use strict";

  const rig =
    document.querySelector("#rig") ||
    document.querySelector("#playerRig");

  const scene =
    document.querySelector("a-scene");

  if (!rig || !scene) {
    console.warn("Ground fix: rig/scene not found.");
    return;
  }

  const START_Y = 1.6;
  const FLOOR_Y = 0;

  function fixSpawn() {
    const p = rig.object3D.position;

    if (
      !Number.isFinite(p.x) ||
      !Number.isFinite(p.y) ||
      !Number.isFinite(p.z)
    ) {
      p.set(0, START_Y, 0);
      return;
    }

    /*
     * If the player starts ridiculously high,
     * put them back at the spawn.
     */
    if (p.y > 8 || p.y < -5) {
      p.set(0, START_Y, 0);
    }

    /*
     * Prevent falling endlessly.
     */
    if (p.y < FLOOR_Y) {
      p.y = START_Y;
    }
  }

  function keepPlayerGrounded() {
    const p = rig.object3D.position;

    /*
     * Don't force Y every frame while jumping.
     * Only recover the player if they fall
     * below the world.
     */
    if (p.y < -10) {
      p.set(0, START_Y, 0);
    }
  }

  fixSpawn();

  setInterval(
    keepPlayerGrounded,
    250
  );

  window.MonkeyVRGroundFix = {
    reset() {
      rig.object3D.position.set(
        0,
        START_Y,
        0
      );
    }
  };

  console.log(
    "🐒 Ground/spawn fix loaded!"
  );

})();
</script>

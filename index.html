      "npc_" +
      M6.npc.nextId++;

    const p =
      position || {
        x:
          Math.random() *
            12 -
          6,

        y:
          1,

        z:
          Math.random() *
            12 -
          6
      };

    npc.id =
      id;

    npc.setAttribute(
      "position",
      `${p.x} ${p.y} ${p.z}`
    );

    npc.setAttribute(
      "geometry",
      "primitive: sphere; radius: .45"
    );

    npc.setAttribute(
      "material",
      "color:#ffffff"
    );

    npc.dataset.npc =
      "true";

    s.appendChild(
      npc
    );

    const data = {
      id,
      entity: npc,
      type,
      health:
        options.health ||
        100,

      speed:
        options.speed ||
        (
          type === "chase"
            ? 2.8
            : 1.5
        ),

      detection:
        options.detection ||
        12,

      state:
        "idle",

      target: null,

      patrolTarget: null,

      attackCooldown: 0
    };

    M6.npc.list.push(
      data
    );

    return data;
  }

  function removeNPC(
    npc
  ) {
    if (!npc) return;

    if (
      npc.entity &&
      npc.entity.parentNode
    ) {
      npc.entity.parentNode
        .removeChild(
          npc.entity
        );
    }

    M6.npc.list =
      M6.npc.list.filter(
        x =>
          x !== npc
      );
  }

  function updateNPCs(
    dt
  ) {
    const p =
      playerPosition();

    M6.npc.list
      .forEach(
        npc => {
          if (
            !npc.entity
          ) return;

          const pos =
            getPosition(
              npc.entity
            );

          const d =
            distance(
              p,
              pos
            );

          if (
            npc.type ===
              "chase" ||
            npc.type ===
              "boss"
          ) {
            if (
              d <=
              npc.detection
            ) {
              npc.target =
                p;

              npc.state =
                "chasing";
            } else {
              npc.state =
                "patrol";
            }
          }

          if (
            npc.type ===
            "flee"
          ) {
            if (
              d < 8
            ) {
              npc.target =
                {
                  x:
                    pos.x +
                    (
                      pos.x -
                      p.x
                    ),

                  y:
                    pos.y,

                  z:
                    pos.z +
                    (
                      pos.z -
                      p.z
                    )
                };

              npc.state =
                "fleeing";
            }
          }

          if (
            npc.target
          ) {
            const target =
              npc.target;

            const dx =
              target.x -
              pos.x;

            const dz =
              target.z -
              pos.z;

            const len =
              Math.sqrt(
                dx * dx +
                dz * dz
              );

            if (
              len >
              0.2
            ) {
              const speed =
                npc.speed *
                dt;

              pos.x +=
                dx /
                len *
                speed;

              pos.z +=
                dz /
                len *
                speed;

              setPosition(
                npc.entity,
                pos
              );
            }
          }

          if (
            npc.attackCooldown >
            0
          ) {
            npc.attackCooldown -=
              dt;
          }

          if (
            npc.type ===
              "chase" &&
            d < 1.2 &&
            npc.attackCooldown <=
              0
          ) {
            playerDamage(
              10
            );

            npc.attackCooldown =
              1.5;
          }
        }
      );

  function playerDamage(
    amount
  ) {
    M6.player.health =
      clamp(
        M6.player.health -
          Math.max(
            0,
            amount
          ),
        0,
        M6.player.maxHealth
      );

    if (
      M6.player.health <=
      0
    ) {
      playerRespawn();
    }
  }

  function playerHeal(
    amount
  ) {
    M6.player.health =
      clamp(
        M6.player.health +
          Math.max(
            0,
            amount
          ),
        0,
        M6.player.maxHealth
      );
  }

  function playerRespawn() {
    M6.player.health =
      M6.player.maxHealth;

    setVelocity(
      0,
      0,
      0
    );

    if (
      typeof resetPlayer ===
      "function"
    ) {
      resetPlayer();
    } else {
      const r =
        rig();

      if (r) {
        setPosition(
          r,
          {
            x: 0,
            y: 1.6,
            z: 0
          }
        );
      }
    }

    msg6(
      "💥 Respawned!"

     ======================================================== */

  function spawnBoss(
    name = "Guardian"
  ) {
    const boss =
      spawnAdvancedNPC(
        "boss",
        {
          x: 0,
          y: 2,
          z: -8
        },
        {
          health: 1000,
          speed: 1.8,
          detection: 30
        }
      );

    if (!boss)
      return null;

    boss.name =
      name;

    boss.maxHealth =
      1000;

    boss.phase =
      1;

    M6.bosses.active.push(
      boss
    );

    msg6(
      "👑 BOSS SPAWNED: " +
      name,
      3500
    );

    return boss;
  }

  function damageBoss(
    boss,
    amount
  ) {
    if (!boss) return;

    boss.health -=
      Math.max(
        0,
        amount
      );

    if (
      boss.health <=
      0
    ) {
      defeatBoss(
        boss
      );
      return;
    }

    const ratio =
      boss.health /
      boss.maxHealth;

    if (
      ratio < 0.66 &&
      boss.phase === 1
    ) {
      boss.phase =
        2;

      boss.speed *=
        1.25;

      msg6(
        "⚠️ BOSS PHASE 2!"
      );
    }

    if (
      ratio < 0.33 &&
      boss.phase === 2
    ) {
      boss.phase =
        3;

      boss.speed *=
        1.35;

      msg6(
        "🔥 BOSS FINAL PHASE!"
      );
    }
  }

  function defeatBoss(
    boss
  ) {
    msg6(
      "🏆 BOSS DEFEATED!"
    );

    if (
      typeof addXP ===
      "function"
    ) {
      addXP(
        500,
        "Boss defeated"
      );
    }

    if (
      typeof MonkeyVRShop !==
      "undefined"
    ) {
      MonkeyVRShop.addCoins(
        500,
        "Boss reward"
      );
    }

    removeNPC(
      boss
    );

    M6.bosses.active =
      M6.bosses.active
        .filter(
          x =>
            x !== boss
        );
  }

  const EVENT_LIST = [
    "Meteor Shower",
    "Blackout",
    "Super Gravity",

    "Speed Boost",
    "Giant World",
    "Tiny World",

  function startEvent(
    name
  ) {
    if (
      M6.events.active
    ) {
      msg6(
        "⚠️ Another event is already active."
      );
      return;
    }

    M6.events.active =
      name;

    M6.events.timer =
      15;

    switch (name) {

      case "Meteor Shower":
        startMeteorEvent();
        break;

      case "Blackout":
        startBlackoutEvent();
        break;

      case "Super Gravity":
        setGravityMultiplier(
          2
        );
        break;

      case "Moon Gravity":
        setGravityMultiplier(
          0.2
        );
        break;

      case "Speed Boost":
        M6.movement.speed *=
          1.8;
        break;

      case "Giant World":
        setWorldScale(
          1.6
        );
        break;

      case "Tiny World":
        setWorldScale(
          0.65
        );
        break;

      case "Rising Lava":
        startLavaEvent();
        break;

      case "Treasure Hunt":
        spawnTreasureEvent();
        break;

      case "NPC Invasion":
        for (
          let i = 0;
          i < 8;
          i++
        ) {
          spawnAdvancedNPC(
            "chase"
          );
        }
        break;

      case "Portal Storm":
        spawnPortalStorm();
        break;

      case "Boss Alert":
        spawnBoss(
          "The Guardian"
        );
        break;

      case "Zero Gravity":
        setGravityMultiplier(
          0
        );
        break;
    }

    msg6(
      "🌎 EVENT: " +
      name,
      3500
    );
  }

  function endEvent() {
    if (
      !M6.events.active
    ) return;

    const name =
      M6.events.active;

    M6.events.active =
      null;

    M6.events.timer =
      0;

    setGravityMultiplier(
      1
    );

    setWorldScale(
      1
    );

    msg6(
      "✅ Event ended: " +
      name
    );
  }

  function spawnMeteor() {
    const s =
      scene();

    if (!s) return;

    const meteor =
      document.createElement(
        "a-sphere"
      );

    meteor.setAttribute(
      "radius",
      ".35"
    );

    meteor.setAttribute(
      "material",
      "color:#ff5500; emissive:#ff2200"
    );

    const p = {
      x:
        Math.random() *
          24 -
        12,

      y:
        12 +
        Math.random() *
          8,

      z:
        Math.random() *
          24 -
        12
    };

    meteor.setAttribute(
      "position",
      `${p.x} ${p.y} ${p.z}`
    );

    s.appendChild(
      meteor
    );

    const interval =
      setInterval(
        () => {
          const pos =
            getPosition(
              meteor
            );

          pos.y -=
            0.35;

          setPosition(
            meteor,
            pos
          );

          if (
            pos.y <
            0
          ) {
            if (
              meteor.parentNode
            ) {
              meteor.parentNode
                .removeChild(
                  meteor
                );
            }

            clearInterval(
              interval
            );
          }
        },
        40
      );
  }

  /* ========================================================

     ======================================================== */

  function comboAction(
    action
  ) {
    const now =
      Date.now();

    if (
      now -
        M6.combo.lastAction >
      2500
    ) {
      M6.combo.count =
        0;

      M6.combo.multiplier =
        1;
    }

    M6.combo.count++;

    M6.combo.lastAction =
      now;

    M6.combo.multiplier =
      1 +
      Math.floor(
        M6.combo.count / 5
      ) *
        0.25;

    if (
      M6.combo.count >=
      3
    ) {
      msg6(
        "🔥 COMBO x" +
        M6.combo.multiplier.toFixed(
          2
        )
      );
    }

    if (
      M6.combo.count >=
      10
    ) {
      if (
        typeof addXP ===
        "function"
      ) {
        addXP(
          10 *
            M6.combo.multiplier,
          "Movement combo"
        );
      }
    }
  }

  /* ========================================================
     MOVEMENT PHYSICS
     ======================================================== */

  function updatePhysics(
    dt
  ) {
    if (
      !M6.movement.enabled
    ) return;

    const r =
      rig();

    if (!r) return;

    updateSwimming();

    updateGrapple(
      dt
    );

    updateZipline(
      dt
    );

    if (
      M6.player.swimming
    ) {
      M6.player.velocity.y +=
        M6.swimming.buoyancy *
        dt;

      M6.player.velocity.y *=
        0.92;
    } else if (
      !M6.player.climbing
    ) {
      const gravity =
        (
          M6.movement.gravity ||
          -9.8
        ) *
        (
          M6.gravityMultiplier ??
          1
        );

      M6.player.velocity.y +=
        gravity *
        dt;
    }

    if (
      M6.player.wallRunning
    ) {
      M6.player.velocity.y +=
        2 *
        dt;

      M6.player.velocity.y =
        clamp(
          M6.player.velocity.y,
          -1,
          4
        );
    }

    const p =
      getPosition(r);

    p.x +=
      M6.player.velocity.x *
      dt;

    p.y +=
      M6.player.velocity.y *
      dt;

    p.z +=
      M6.player.velocity.z *
      dt;

    if (
      p.y <=
      0.9
    ) {
      p.y =
        0.9;

      if (
        M6.player.velocity.y <
        0
      ) {
        M6.player.velocity.y =
          0;
      }

      M6.player.grounded =
        true;

      M6.player.jumpsLeft =
        M6.movement.doubleJumpCount;
    } else {
      M6.player.grounded =
        false;
    }

    if (
      !M6.player.wallRunning &&
      !M6.player.climbing
    ) {
      M6.player.velocity.x *=
        Math.pow(
          M6.movement.momentumAmount,
          dt * 60
        );

      M6.player.velocity.z *=
        Math.pow(
          M6.movement.momentumAmount,
          dt * 60
        );
    }

    setPosition(
      r,
      p
    );
  }

  /* ========================================================
     STAMINA
     ======================================================== */

  function updateStamina(
    dt
  ) {
    const movingFast =
      Math.abs(
        M6.player.velocity.x
      ) +
      Math.abs(
        M6.player.velocity.z
      ) >
      5;

    if (
      movingFast ||
      M6.player.wallRunning ||
      M6.player.climbing
    ) {
      M6.player.stamina -=
        12 * dt;
    } else {
      M6.player.stamina +=
        18 * dt;
    }

    M6.player.stamina =
      clamp(
        M6.player.stamina,
        0,
        M6.player.maxStamina
      );

    if (
      M6.player.stamina <=
      0
    ) {
      M6.player.wallRunning =
        false;

      M6.player.climbing =
        false;
    }
  }

  /* ========================================================
     MAIN LOOP
     ======================================================== */

  let lastTime =
    performance.now();

  function loop(now) {

    const rawDt =
      Math.min(
        0.05,
        (
          now -
          lastTime
        ) /
        1000
      );

    lastTime =
      now;

    const dt =
      rawDt *
      (
        M6.timeScale ??
        1
      );

    updatePhysics(
      dt
    );

    updateNPCs(
      dt
    );

    updateEvent(
      rawDt
    );

    updateStamina(
      rawDt
    );

    updateHUD();

    requestAnimationFrame(
      loop
    );
  }

      i < 6;

        chars[
          Math.floor(

            chars.length

        ];

  function updateRemotePlayer(

          y:
            Number(
              data.velocity.y

          z:

      Number(
        data.score

      !!data.tagger;

            ? " 🔥"
            : ""
        )
      );
    }

    M7.packets.received++;
  }

  function updateRemoteVisuals(
    dt
  ) {
    M7.players
      .forEach(
        player => {

          if (
            !player.entity
          ) return;

          const smooth =
            M7.settings
              .smoothPlayers &&
            M7.interpolation
              .enabled;

          const amount =
            smooth
              ? clamp(
                  dt * 12,
                  0,
                  1
                )
              : 1;

          player.current.x =
            lerp(
              player.current.x,
              player.target.x,
              amount
            );

          player.current.y =
            lerp(
              player.current.y,
              player.target.y,
              amount
            );

          player.current.z =
            lerp(
              player.current.z,
              player.target.z,
              amount
            );

          player.entity
            .object3D
            .position
            .set(
              player.current.x,
              player.current.y,
              player.current.z
            );

          player.entity
            .object3D
            .rotation
            .set(
              player.rotation.x,
              player.rotation.y,
              player.rotation.z
            );

          if (
            player.name
          ) {
            player.name
              .setAttribute(
                "visible",
                M7.settings
                  .showNames
              );
          }
        }
      );
  }

  /* ========================================================
     LOCAL STATE
     ======================================================== */

  function getLocalState() {
    const r =
      rig();

    let position = {
      x: 0,
      y: 1,
      z: 0
    };

    let rotation = {
      x: 0,
      y: 0,
      z: 0
    };

    if (r) {
      const p =
        r.object3D.position;

      position = {
        x: p.x,
        y: p.y,
        z: p.z
      };

      if (
        r.object3D.rotation
      ) {
        rotation = {
          x:
            r.object3D.rotation.x,

          y:
            r.object3D.rotation.y,

          z:
            r.object3D.rotation.z
        };
      }
    }

    let velocity = {
      x: 0,
      y: 0,
      z: 0
    };

    if (
      typeof MonkeyVRAdvanced !==
      "undefined" &&
      MonkeyVRAdvanced.state &&
      MonkeyVRAdvanced.state.player &&
      MonkeyVRAdvanced.state.player.velocity
    ) {
      velocity =
        {
          ...MonkeyVRAdvanced
            .state
            .player
            .velocity
        };
    }

    return {
      id:
        M7.localPlayer.id,

      username:
        M7.localPlayer.username,

      platform:
        M7.localPlayer.platform,

      team:
        M7.localPlayer.team,

      position,

      rotation,

      velocity,

      tagger:
        M7.localPlayer.tagger,

      frozen:
        M7.localPlayer.frozen,

      spectator:
        M7.localPlayer.spectator,

      ready:
        M7.localPlayer.ready,

      score:
        M7.localPlayer.score,

      room:
        M7.room.code
    };

    if (
      !M7.room.code
    ) return;

    const state =
      getLocalState();

    M7.localPlayer.position =
      state.position;

    M7.localPlayer.rotation =
      state.rotation;

    M7.localPlayer.velocity =
      state.velocity;

    sendPacket(
      "player_state",
      state
    );

  /* ========================================================
     PACKET HANDLER
     ======================================================== */

  function handlePacket(
    packetData
  ) {
    if (
      !packetData ||
      typeof packetData !==
      "object"
    ) {
      return;
    }

    const type =
      packetData.type;

    const data =
      packetData.data ||
      {};

    switch (
      type
    ) {

      case "player_join":
        createRemotePlayer(
          data
        );

        notify7(
          "👋 " +
          (
            data.username ||
            "Monkey"
          ) +
          " joined."
        );

        break;

      case "player_leave":
        removeRemotePlayer(
          data.id
        );

        notify7(
          "👋 Player left."
        );

        break;

      case "player_state":
        updateRemotePlayer(
          data
        );

        break;

      case "room_state":
        applyRoomState(
          data
        );

        break;

      case "round_start":
        startRound(
          data
        );

        break;

      case "round_end":
        endRound(
          data
        );

        break;

      case "vote_start":
        startVote(
          data
        );

        break;

      case "vote_update":
        applyVoteUpdate(
          data
        );

        break;

      case "team_update":
        applyTeamUpdate(
          data
        );

        break;

      case "tag_update":
        applyTagUpdate(
          data
        );

        break;

      case "spectator":
        applySpectator(
          data
        );

        break;

      case "server_ping":
        handlePing(
          packetData
        );

        break;

      case "room_kick":
        leaveRoom();

        notify7(
          "🚪 You were removed from the room."
        );

        break;

      case "room_ban":
        leaveRoom();

        notify7(
          "🚫 You cannot join this room."
        );

        break;

      case "announcement":
        notify7(
          "📢 " +
          (
            data.message ||
            ""
          ),
          5000
        );

        break;
    }
  }

  function applyRoomState(
    data
  ) {
    Object.keys(
      data || {}
    ).forEach(
      key => {

        if (
          Object.prototype
            .hasOwnProperty.call(
              M7.room,
              key
            )
        ) {
          M7.room[key] =
            data[key];
        }

      }
    );

    if (
      Array.isArray(
        data.players
      )
    ) {
      data.players
        .forEach(
          player => {
            createRemotePlayer(
              player
            );
          }
        );
    }

    notify7(
      "🏠 Room synced."
    );
  }

  /* ========================================================
     TAG SYSTEM
     ======================================================== */

  function applyTagUpdate(
    data
  ) {
    M7.localPlayer.tagger =
      data.taggerId ===
      M7.localPlayer.id;

    M7.players
      .forEach(
        player => {
          player.tagger =
            player.id ===
            data.taggerId;
        }
      );

    if (
      M7.localPlayer.tagger
    ) {
      notify7(
        "🔥 YOU ARE IT!"
      );
    }
  }

  function tagPlayer(
    targetId

    if (
      !targetId ||
      !M7.room.code
    ) return;

    sendPacket(
      "tag_player",
      {
        targetId
      }
    );
  }

  /* ========================================================
     TEAM SYSTEM
     ======================================================== */

  function applyTeamUpdate(
    data
  ) {
    M7.teams = {
      red:
        data.red || [],

      blue:
        data.blue || [],

      green:
        data.green || [],

      yellow:
        data.yellow || []
    };

    if (
      data.assignments &&
      data.assignments[
        M7.localPlayer.id
      ]
    ) {
      M7.localPlayer.team =
        data.assignments[
          M7.localPlayer.id
        ];
    }

    M7.players
      .forEach(
        player => {
          if (
            data.assignments &&
            data.assignments[
              player.id
            ]
          ) {
            player.team =
              data.assignments[
                player.id
              ];
          }
        }
      );
  }

  function requestTeam(
    team
  ) {
    const allowed = [
      "red",
      "blue",
      "green",
      "yellow"
    ];

    if (
      !allowed.includes(
        team
      )
    ) {
      return;
    }

    sendPacket(
      "team_request",
      {
        team
      }
    );
  }

  /* ========================================================
     ROUND SYSTEM
     ======================================================== */

  function startRound(
    data = {}
  ) {
    M7.room.started =
      true;

    M7.room.state =
      "playing";

    M7.room.round =
      Number(
        data.round
      ) ||
      M7.room.round;

    M7.room.roundTime =
      Number(
        data.duration
      ) ||
      180;

    M7.localPlayer.roundScore =
      0;

    notify7(
      "🎮 ROUND " +
      M7.room.round +
      " START!",
      3000
    );
  }

  function endRound(
    data = {}
  ) {
    M7.room.started =
      false;

    M7.room.state =
      "round_end";

    if (
      data.scores
    ) {
      Object.keys(
        data.scores
      ).forEach(
        id => {

          if (
            id ===
            M7.localPlayer.id
          ) {
            M7.localPlayer
              .score =
              Number(
                data.scores[id]
              ) || 0;
          }

          const player =
            M7.players.get(
              id
            );

          if (player) {
            player.score =
              Number(
                data.scores[id]
              ) || 0;
          }

        }
      );
    }

    notify7(
      "🏁 ROUND COMPLETE!",
      3000
    );
  }

  /* ========================================================
     MAP / MODE VOTING
     ======================================================== */

  function startVote(
    data = {}
  ) {
    M7.voting.active =
      true;

    M7.voting.choices =
      Array.isArray(
        data.choices
      )
        ? data.choices
        : [];

    M7.voting.votes =
      {};

    M7.voting.endsAt =
      Date.now() +
      (
        Number(
          data.duration
        ) || 15
      ) *
      1000;

    notify7(
      "🗳️ Vote started!"
    );
  }

  function vote(
    choice
  ) {
    if (
      !M7.voting.active
    ) return;

    if (
      !M7.voting.choices
        .includes(
          choice
        )
    ) {
      return;
    }

    M7.voting.votes[
      M7.localPlayer.id
    ] =
      choice;

    sendPacket(
      "vote",
      {
        choice
      }
    );

    notify7(
      "🗳️ Voted for " +
      choice
    );
  }

  function applyVoteUpdate(
    data
  ) {
    M7.voting.votes =
      data.votes ||
      {};

    if (
      data.finished
    ) {
      M7.voting.active =
        false;

      if (
        data.winner
      ) {
        notify7(
          "🏆 Vote winner: " +
          data.winner
        );
      }
    }
  }

  /* ========================================================
     SPECTATOR MODE
     ======================================================== */

  function enterSpectator() {
    M7.spectator.active =
      true;

    M7.localPlayer.spectator =
      true;

    M7.localPlayer.frozen =
      true;

    chooseSpectatorTarget();

    notify7(
      "👁️ Spectator mode"
    );
  }

  function exitSpectator() {
    M7.spectator.active =
      false;

    M7.localPlayer.spectator =
      false;

    M7.localPlayer.frozen =
      false;

    M7.spectator.targetId =
      null;

    notify7(
      "🐒 Back to player mode."
    );
  }

  function chooseSpectatorTarget() {
    const players =
      Array.from(
        M7.players.values()
      );

    if (
      !players.length
    ) {
      M7.spectator.targetId =
        null;

      return;
    }

    M7.spectator.index =
      clamp(
        M7.spectator.index,
        0,
        players.length - 1
      );

    M7.spectator.targetId =
      players[
        M7.spectator.index
      ].id;
  }

  function nextSpectator() {
    const players =
      Array.from(
        M7.players.values()
      );

    if (
      !players.length
    ) return;

    M7.spectator.index =
      (
        M7.spectator.index +
        1
      ) %
      players.length;

    chooseSpectatorTarget();
  }

  function updateSpectator() {
    if (
      !M7.spectator.active
    ) return;

    const target =
      M7.players.get(
        M7.spectator.targetId
      );

    const cam =
      camera();

    if (
      !target ||
      !cam
    ) return;

    const p =
      target.current;

    cam.object3D.position
      .set(
        p.x,
        p.y + 2,
        p.z + 4
      );

    cam.object3D
      .lookAt(
        p.x,
        p.y,
        p.z
      );
  }

  /* ========================================================
     PING
     ======================================================== */

  function pingServer() {
    const timestamp =
      Date.now();

    sendPacket(
      "ping",
      {
        timestamp
      }
    );
  }

  function handlePing(
    packetData
  ) {
    const sent =
      Number(
        packetData.data &&
        packetData.data
          .timestamp
      );

    if (
      sent
    ) {
      M7.connection.ping =
        Math.max(
          0,
          Date.now() -
          sent
        );
    }
  }

  /* ========================================================
     RECONNECT
     ======================================================== */

  function scheduleReconnect() {
    if (
      !M7.reconnect.enabled
    ) return;

    if (
      M7.connection.attempts >=
      M7.connection.maxAttempts
    ) {
      notify7(
        "❌ Reconnect attempts ended."
      );

      return;
    }

    M7.connection.reconnecting =
      true;

    const delay =
      Math.min(
        15000,
        1000 *
        Math.pow(
          2,
          M7.connection.attempts
        )
      );

    M7.reconnect.nextAttempt =
      Date.now() +
      delay;

    M7.connection.attempts++;

    notify7(
      "🔄 Reconnecting in " +
      Math.ceil(
        delay / 1000
      ) +
      "s..."
    );
  }

  function attemptReconnect() {
    if (
      !M7.connection.reconnecting
    ) return;

    if (
      Date.now() <
      M7.reconnect.nextAttempt
    ) {
      return;
    }

    M7.connection.reconnecting =
      false;

    if (
      M7.room.code
    ) {
      joinRoom(
        M7.room.code
      );
    }
  }

  /* ========================================================
     SCOREBOARD
     ======================================================== */

  function getScoreboard() {
    const list =
      Array.from(
        M7.players.values()
      )
      .map(
        player => ({
          id:
            player.id,

          username:
            player.username,

          score:
            player.score,

          team:
            player.team,

          tagger:
            player.tagger
        })
      );

    list.push({
      id:
        M7.localPlayer.id,

      username:
        M7.localPlayer.username,

      score:
        M7.localPlayer.score,

      team:
        M7.localPlayer.team,

      tagger:
        M7.localPlayer.tagger
    });

    return list.sort(
      (
        a,
        b
      ) =>
        b.score -
        a.score
    );
  }

        "&lt;"

        /"/g,
        "&quot;"

     ======================================================== */

  function setupKeys() {
    window.addEventListener(
      "keydown",
      event => {

        if (
          event.repeat
        ) return;

        const key =
          event.key.toLowerCase();

        if (
          key ===
          "l"
        ) {
          openRoomPanel();
        }

        if (
          key ===
          "tab"
        ) {
          event.preventDefault();

          openScoreboard();
        }

        if (
          key ===
          "p"
        ) {
          if (
            M7.spectator.active
          ) {
            nextSpectator();
          }
        }

        if (
          key ===
          "y"
        ) {
          setReady(
            !M7.localPlayer
              .ready
          );
        }
      }
    );
  }

  /* ========================================================
     CONNECTION HOOK
     ======================================================== */

  function setupConnectionHooks() {

    /*
     * If Part 4 exposes its packet receiver,
     * wrap it without destroying the original.
     */

    if (
      typeof window
        .MonkeyVROnline ===
      "object"
    ) {

      const online =
        window
          .MonkeyVROnline;

      if (
        typeof online
          .handlePacket ===
        "function"
      ) {

        const original =
          online.handlePacket;

        if (
          !online
            ._m7Wrapped
        ) {

          online.handlePacket =
            function (
              data
            ) {

              try {
                original(
                  data
                );
              } catch (
                err
              ) {}

              try {
                handlePacket(
                  data
                );
              } catch (
                err
              ) {}

            };

          online._m7Wrapped =
            true;
        }
      }

      M7.connection.connected =
        !!online.connected;
    }
  }

  /* ========================================================
     HEARTBEAT
     ======================================================== */

  function heartbeat() {
    const timestamp =
      Date.now();

    M7.connection
      .lastHeartbeat =
      timestamp;

    sendPacket(
      "heartbeat",
      {
        timestamp
      }
    );
  }

  /* ========================================================
     MAIN LOOP
     ======================================================== */

  let lastLoop =
    performance.now();

  let stateTimer =
    0;

  let pingTimer =
    0;

  function loop(
    timestamp
  ) {
    const dt =
      Math.min(
        .05,
        (
          timestamp -
          lastLoop
        ) /
        1000
      );

    lastLoop =
      timestamp;

    updateRemoteVisuals(
      dt
    );

    updateSpectator();

    updateHUD();

    stateTimer +=
      dt;

    pingTimer +=
      dt;

    if (
      stateTimer >=
      0.05
    ) {
      sendLocalState();

      stateTimer =
        0;
    }

    if (
      pingTimer >=
      2
    ) {
      pingServer();

      pingTimer =
        0;
    }

    attemptReconnect();

    requestAnimationFrame(
      loop
    );
  }

  /* ========================================================
     INITIALIZATION
     ======================================================== */

  function initPart7() {
    if (
      M7.initialized
    ) return;

    M7.initialized =
      true;

    loadPlayerIdentity();

    createHUD();

    setupKeys();

    setupConnectionHooks();

    /*
     * Give Part 4's online layer a moment
     * to finish initializing.
     */
    setTimeout(
      setupConnectionHooks,
      1000
    );

    /*
     * Local test players are NOT spawned
     * automatically because they could be
     * mistaken for real online players.
     */

    setInterval(
      heartbeat,
      5000
    );

    setInterval(
      () => {
        if (
          M7.room.code &&
          !M7.connection.connected
        ) {
          scheduleReconnect();
        }
      },
      5000
    );

    notify7(
      "🌐 Part 7 Multiplayer Client loaded!",
      3000
    );

    requestAnimationFrame(
      loop
    );
  }

  if (
    document.readyState ===
    "loading"
  ) {
    document.addEventListener(
      "DOMContentLoaded",
      initPart7
    );
  } else {
    initPart7();
  }

})();

  function rot8(v) {
    return {
      x: Number(v.x) || 0,
      y: Number(v.y) || 0,
      z: Number(v.z) || 0
    };
  }

  function scale8(v) {
    return {
      x: Number(v.x) || 1,
      y: Number(v.y) || 1,
      z: Number(v.z) || 1
    };
  }

  function notify8(message) {
    if (typeof window.showToast === "function") {
      window.showToast(message);
      return;
    }

    let el = document.querySelector("#m8-toast");

    if (!el) {
      el = document.createElement("div");
      el.id = "m8-toast";

      Object.assign(el.style, {
        position: "fixed",
        left: "50%",
        bottom: "30px",
        transform: "translateX(-50%)",
        background: "rgba(0,0,0,.82)",
        color: "white",
        padding: "12px 18px",
        borderRadius: "12px",
        zIndex: "99999",
        fontFamily: "Arial",
        fontSize: "14px",
        pointerEvents: "none",
        opacity: "0",
        transition: "opacity .2s"
      });

      document.body.appendChild(el);
    }

    el.textContent = message;
    el.style.opacity = "1";

    clearTimeout(el._timer);

    el._timer = setTimeout(() => {
      el.style.opacity = "0";
    }, 1600);
  }

  /* -------------------------
     BUILDER ROOT

  function ensureBuilderRoot() {
    const scene = scene8();
    if (!scene) return null;

    let root = document.querySelector("#creator-build-root");

    if (!root) {
      root = document.createElement("a-entity");
      root.id = "creator-build-root";
      scene.appendChild(root);
    }

    return root;
  }

  /* -------------------------
     HISTORY
  ------------------------- */

  function snapshot8() {
    return {
      objects: JSON.parse(JSON.stringify(M8.objects)),
      logic: JSON.parse(JSON.stringify(M8.logic)),
      mapData: JSON.parse(JSON.stringify(M8.mapData))
    };
  }

  function pushHistory8() {
    M8.history.push(snapshot8());

    if (M8.history.length > 50) {
      M8.history.shift();
    }

    M8.future.length = 0;
  }

  function restore8(state) {
    if (!state) return;

    M8.objects = JSON.parse(JSON.stringify(state.objects || []));
    M8.logic = JSON.parse(JSON.stringify(state.logic || []));
    M8.mapData = JSON.parse(
      JSON.stringify(state.mapData || M8.mapData)
    );

    renderObjects8();
    notify8("Restored");
  }

  function undo8() {
    if (!M8.history.length) {
      notify8("Nothing to undo");
      return;
    }

    M8.future.push(snapshot8());

    const state = M8.history.pop();

    restore8(state);
  }

  function redo8() {
    if (!M8.future.length) {
      notify8("Nothing to redo");
      return;
    }

    M8.history.push(snapshot8());

    const state = M8.future.pop();

    restore8(state);
  }

  /* -------------------------
     OBJECT CREATION
  ------------------------- */

  function objectPosition8() {
    const rig = rig8();

    if (!rig) {
      return {
        x: 0,
        y: 2,
        z: -3
      };
    }

    const p = rig.object3D.position;

    return {
      x: snap8(p.x, M8.grid),
      y: snap8(p.y, M8.grid),
      z: snap8(p.z - 3, M8.grid)
    };
  }

  function createObject8(type, position) {
    if (!TYPES8[type]) type = "box";

    pushHistory8();

    const object = {
      id: uid8("obj"),
      type,
      name: TYPES8[type].label,
      position: vec8(position || objectPosition8()),
      rotation: {
        x: 0,
        y: 0,
        z: 0
      },
      scale: {
        x: 1,
        y: 1,
        z: 1
      },
      color: "",
      locked: false,
      visible: true,
      physics: false,
      moving: false,
      movePath: null,
      metadata: {
        created: Date.now()
      }
    };

    M8.objects.push(object);

    renderObjects8();

    selectObject8(object.id);

    return object;
  }

  /* -------------------------
     OBJECT DOM
  ------------------------- */

  function makeEntity8(object) {
    const el = document.createElement("a-entity");

    el.dataset.creatorObject = object.id;

    const def = TYPES8[object.type] || TYPES8.box;

    el.setAttribute("geometry", def.geometry);

    el.setAttribute(
      "position",
      `${object.position.x} ${object.position.y} ${object.position.z}`
    );

    el.setAttribute(
      "rotation",
      `${object.rotation.x} ${object.rotation.y} ${object.rotation.z}`
    );

    el.setAttribute(
      "scale",
      `${object.scale.x} ${object.scale.y} ${object.scale.z}`
    );

    if (object.color) {
      el.setAttribute("material", `color:${object.color};roughness:.8`);
    }

    if (object.type === "button") {
      el.setAttribute("material", "color:#ff5555");
    }

    if (object.type === "jump") {
      el.setAttribute("material", "color:#55ddff");
    }

    if (object.type === "checkpoint") {
      el.setAttribute("material", "color:#55ff88");
    }

    if (object.type === "trigger") {
      el.setAttribute(
        "material",
        "color:#aa66ff;opacity:.22;transparent:true"
      );
    }

    if (object.type === "portal") {
      el.setAttribute("material", "color:#55aaff;shader:flat");
    }

    if (object.type === "lava") {
      el.setAttribute("material", "color:#ff4422;emissive:#ff2200");
    }

    if (object.type === "sign") {
      el.setAttribute(
        "material",
        "color:#eeeeee;side:double"
      );
    }

    if (object.locked) {
      el.setAttribute(
        "material",
        "color:#777777;opacity:.65"
      );
    }

    el.addEventListener("click", function (event) {
      event.stopPropagation();
      selectObject8(object.id);
    });

    el.addEventListener("mouseenter", function () {
      if (object.locked) return;

      if (!M8.testMode) {
        el.setAttribute(
          "material",
          "color:#ffff66;opacity:.95"
        );
      }
    });

    el.addEventListener("mouseleave", function () {
      if (!object.color) {
        el.removeAttribute("material");
      }
    });

    return el;
  }

  function renderObjects8() {
    const root = ensureBuilderRoot();

    if (!root) return;

    while (root.firstChild) {
      root.removeChild(root.firstChild);
    }

    M8.objects.forEach(object => {
      if (!object.visible) return;

      const el = makeEntity8(object);

      root.appendChild(el);
    });
  }

  /* -------------------------
     SELECT
  ------------------------- */

  function selectObject8(id) {
    const object = M8.objects.find(o => o.id === id);

    if (!object) return;

    M8.selected = id;

    document
      .querySelectorAll("[data-creator-selected]")
      .forEach(el => {
        el.removeAttribute("data-creator-selected");
        el.setAttribute("material", "opacity:1");
      });

    const el = document.querySelector(
      `[data-creator-object="${id}"]`
    );

    if (el) {
      el.dataset.creatorSelected = "true";

      el.setAttribute(
        "material",
        "color:#ffff55;opacity:.9"
      );
    }

    updateBuilderUI8();

    window.dispatchEvent(
      new CustomEvent("monkeyvr:creatorSelect", {
        detail: object
      })
    );
  }

  function selectedObject8() {
    return M8.objects.find(
      o => o.id === M8.selected
    ) || null;
  }

  /* -------------------------
     TRANSFORMS
  ------------------------- */

  function moveSelected8(x, y, z) {
    const object = selectedObject8();

    if (!object || object.locked) return;

    pushHistory8();

    object.position.x = snap8(
      object.position.x + Number(x || 0),
      M8.grid
    );

    object.position.y = snap8(
      object.position.y + Number(y || 0),
      M8.grid
    );

    object.position.z = snap8(
      object.position.z + Number(z || 0),
      M8.grid
    );

    renderObjects8();
    selectObject8(object.id);
  }

  function rotateSelected8(x, y, z) {
    const object = selectedObject8();

    if (!object || object.locked) return;

    pushHistory8();

    object.rotation.x += Number(x || 0);
    object.rotation.y += Number(y || 0);
    object.rotation.z += Number(z || 0);

    object.rotation.x =
      Math.round(object.rotation.x / M8.rotationSnap) *
      M8.rotationSnap;

    object.rotation.y =
      Math.round(object.rotation.y / M8.rotationSnap) *
      M8.rotationSnap;

    object.rotation.z =
      Math.round(object.rotation.z / M8.rotationSnap) *
      M8.rotationSnap;

    renderObjects8();
    selectObject8(object.id);
  }

  function scaleSelected8(x, y, z) {
    const object = selectedObject8();

    if (!object || object.locked) return;

    pushHistory8();

    object.scale.x = clamp8(
      object.scale.x * Number(x || 1),
      .1,
      20
    );

    object.scale.y = clamp8(
      object.scale.y * Number(y || 1),
      .1,
      20
    );

    object.scale.z = clamp8(
      object.scale.z * Number(z || 1),
      .1,
      20
    );

    renderObjects8();
    selectObject8(object.id);
  }

  /* -------------------------
     DELETE / DUPLICATE
  ------------------------- */

  function deleteSelected8() {
    if (!M8.selected) return;

    const index = M8.objects.findIndex(
      o => o.id === M8.selected
    );

    if (index < 0) return;

    if (M8.objects[index].locked) {
      notify8("Object is locked");
      return;
    }

    pushHistory8();

    M8.objects.splice(index, 1);

    M8.selected = null;

    renderObjects8();

    updateBuilderUI8();
  }

  function duplicateSelected8() {
    const object = selectedObject8();

    if (!object) return;

    pushHistory8();

    const copy = JSON.parse(
      JSON.stringify(object)
    );

    copy.id = uid8("obj");

    copy.position.x += M8.grid;

    copy.position.z += M8.grid;

    copy.name += " Copy";

    M8.objects.push(copy);

    renderObjects8();

    selectObject8(copy.id);
  }

  function copySelected8() {
    const object = selectedObject8();

    if (!object) return;

    M8.clipboard = JSON.parse(
      JSON.stringify(object)
    );

    notify8("Copied");
  }

  function paste8() {
    if (!M8.clipboard) {
      notify8("Clipboard empty");
      return;
    }

    pushHistory8();

    const copy = JSON.parse(
      JSON.stringify(M8.clipboard)
    );

    copy.id = uid8("obj");

    const p = objectPosition8();

    copy.position = {
      x: p.x,
      y: p.y,
      z: p.z
    };

    copy.name += " Paste";

    M8.objects.push(copy);

    renderObjects8();

    selectObject8(copy.id);
  }

  /* -------------------------
     LOCK / VISIBILITY
  ------------------------- */

  function toggleLock8() {
    const object = selectedObject8();

    if (!object) return;

    pushHistory8();

    object.locked = !object.locked;

    renderObjects8();

    selectObject8(object.id);

    notify8(
      object.locked
        ? "Object locked"
        : "Object unlocked"
    );
  }

  function toggleVisibility8() {
    const object = selectedObject8();

    if (!object) return;

    pushHistory8();

    object.visible = !object.visible;

    renderObjects8();

    updateBuilderUI8();
  }

  /* -------------------------
     PREFABS
  ------------------------- */

  function savePrefab8() {
    const object = selectedObject8();

    if (!object) {
      notify8("Select an object first");
      return;
    }

    const prefab = JSON.parse(
      JSON.stringify(object)
    );

  function spawnPrefab8(index) {
    const prefab = M8.prefabs[index];

    if (!prefab) return;

    pushHistory8();

    const copy = JSON.parse(
      JSON.stringify(prefab)
    );

    copy.id = uid8("obj");

    copy.position = objectPosition8();

    renderObjects8();

  /* -------------------------
     LOGIC BLOCKS
  ------------------------- */

  const LOGIC_TYPES8 = [
    "player_enters",
    "player_exits",
    "button_pressed",
    "timer",
    "round_start",
    "round_end",
    "player_tagged",
    "object_hit",
    "random_event"
  ];

  function addLogic8(type, action, target) {
    if (!LOGIC_TYPES8.includes(type)) {
      type = "player_enters";
    }

    pushHistory8();

    const block = {
      id: uid8("logic"),
      trigger: type,
      action: action || "toggle",
      target: target || null,
      delay: 0,
      enabled: true
    };

    M8.logic.push(block);

    saveCreatorState8();

    notify8("Logic block added");

    return block;
  }

  function removeLogic8(id) {
    const index = M8.logic.findIndex(
      l => l.id === id
    );

    if (index < 0) return;

    pushHistory8();

    M8.logic.splice(index, 1);

    saveCreatorState8();

    updateBuilderUI8();
  }

  function runLogic8(trigger, payload) {
    M8.logic
      .filter(l => l.enabled && l.trigger === trigger)
      .forEach(block => {
        setTimeout(() => {
          executeAction8(
            block.action,
            block.target,
            payload
          );
        }, clamp8(Number(block.delay) || 0, 0, 30000));
      });
  }

  function executeAction8(action, target, payload) {
    const object = M8.objects.find(
      o => o.id === target
    );

    switch (action) {
      case "toggle":
        if (object) {
          object.visible = !object.visible;
          renderObjects8();
        }
        break;

      case "open":
        if (object) {
          object.position.y += 3;
          renderObjects8();
        }
        break;

      case "close":
        if (object) {
          object.position.y -= 3;
          renderObjects8();
        }
        break;

      case "move":
        if (object) {
          object.position.x += 2;
          renderObjects8();
        }
        break;

      case "teleport":
        if (object && rig8()) {
          rig8().object3D.position.copy(
            object.position
          );
        }
        break;

      case "spawn":
        createObject8(
          "box",
          objectPosition8()
        );
        break;

      case "random_power":
        if (
          window.MonkeyVR &&
          typeof window.MonkeyVR.randomPower === "function"
        ) {
          window.MonkeyVR.randomPower();
        }
        break;

      case "announce":
        notify8(
          payload?.message ||
          "Creator event triggered!"
        );
        break;

      case "event":
        if (
          window.MonkeyVR &&
          typeof window.MonkeyVR.randomEvent === "function"
        ) {
          window.MonkeyVR.randomEvent();
        }
        break;
    }
  }

  /* -------------------------
     BUTTON INTERACTION
  ------------------------- */

  function activateCreatorButton8(object) {
    if (!object) return;

    runLogic8(
      "button_pressed",
      {
        objectId: object.id
      }
    );

    const linked = M8.logic.filter(
      l =>
        l.trigger === "button_pressed" &&
        l.target === object.id &&
        l.enabled
    );

    linked.forEach(block => {
      executeAction8(
        block.action,
        block.target
      );
    });

    notify8("Button pressed");
  }

  /* -------------------------
     TRIGGER ZONES
  ------------------------- */

  function checkTriggers8() {
    const rig = rig8();

    if (!rig) return;

    const rp = rig.object3D.position;

    M8.objects
      .filter(o =>
        o.type === "trigger" &&
        o.visible
      )
      .forEach(trigger => {
        const distance =
          Math.sqrt(
            Math.pow(
              rp.x - trigger.position.x,
              2
            ) +
            Math.pow(
              rp.y - trigger.position.y,
              2
            ) +
            Math.pow(
              rp.z - trigger.position.z,
              2
            )
          );

        if (distance < 1.8) {
          runLogic8(
            "player_enters",
            {
              triggerId: trigger.id
            }
          );
        }
      });
  }

  /* -------------------------
     MOVING PLATFORMS
  ------------------------- */

  function updateMovingObjects8(time) {
    M8.objects
      .filter(o =>
        o.type === "moving" &&
        o.visible
      )
      .forEach(object => {
        const start =
          object.metadata.startPosition ||
          (object.metadata.startPosition =
            vec8(object.position));

        const speed = 0.0015;

        const wave =
          Math.sin(time * speed + object.id.length);

        object.position.x =
          start.x + wave * 3;

        object.position.z =
          start.z + Math.cos(
            time * speed +
            object.id.length
          ) * 2;

        const el = document.querySelector(
          `[data-creator-object="${object.id}"]`
        );

        if (el) {
          el.object3D.position.set(
            object.position.x,
            object.position.y,
            object.position.z
          );
        }
      });
  }

  /* -------------------------
     MAP SAVE FORMAT
  ------------------------- */

  function getMapPackage8() {
    return {
      format: "MONKEYVR_MAP",
      formatVersion: 2,
      exportedAt: Date.now(),
      map: JSON.parse(
        JSON.stringify(M8.mapData)
      ),
      objects: JSON.parse(
        JSON.stringify(M8.objects)
      ),
      logic: JSON.parse(
        JSON.stringify(M8.logic)
      ),
      prefabs: JSON.parse(
        JSON.stringify(M8.prefabs)
      )
    };
  }

  function applyMapPackage8(data) {
    if (!data) return false;

    if (
      data.format &&
      data.format !== "MONKEYVR_MAP"
    ) {
      notify8("Invalid map format");
      return false;
    }

    pushHistory8();

    M8.mapData = JSON.parse(
      JSON.stringify(
        data.map || M8.mapData
      )
    );

    M8.objects = JSON.parse(
      JSON.stringify(
        data.objects || []
      )
    );

    M8.logic = JSON.parse(
      JSON.stringify(
        data.logic || []
      )
    );

    M8.prefabs = JSON.parse(
      JSON.stringify(
        data.prefabs || []
      )
    );

    M8.selected = null;

    renderObjects8();

    saveCreatorState8();

    notify8("Map loaded");

    return true;
  }

  function saveMap8(slot) {
    slot = String(slot || "slot1");

    const data = getMapPackage8();

    M8.saveSlots[slot] = data;

    saveCreatorState8();

    notify8("Map saved to " + slot);
  }

  function loadMap8(slot) {
    slot = String(slot || "slot1");

    const data = M8.saveSlots[slot];

    if (!data) {
      notify8("No map in " + slot);
      return;
    }

    applyMapPackage8(data);
  }

  function clearMap8() {
    if (!confirm("Clear the current creator map?")) {
      return;
    }

    pushHistory8();

    M8.objects.length = 0;
    M8.logic.length = 0;
    M8.selected = null;

    renderObjects8();

    saveCreatorState8();

    notify8("Map cleared");
  }

  /* -------------------------
     LOCAL PERSISTENCE
  ------------------------- */

  function saveCreatorState8() {
    try {
      localStorage.setItem(
        "MonkeyVR_CreatorV2",
        JSON.stringify({
          mapData: M8.mapData,
          objects: M8.objects,
          logic: M8.logic,
          prefabs: M8.prefabs,
          saveSlots: M8.saveSlots
        })
      );
    } catch (e) {
      console.warn("Creator save failed", e);
    }
  }

  function loadCreatorState8() {
    try {
      const raw =
        localStorage.getItem(
          "MonkeyVR_CreatorV2"
        );

      if (!raw) return;

      const data = JSON.parse(raw);

      if (data.mapData) {
        M8.mapData = data.mapData;
      }

      if (Array.isArray(data.objects)) {
        M8.objects = data.objects;
      }

      if (Array.isArray(data.logic)) {
        M8.logic = data.logic;
      }

      if (Array.isArray(data.prefabs)) {
        M8.prefabs = data.prefabs;
      }

      if (data.saveSlots) {
        M8.saveSlots = data.saveSlots;
      }
    } catch (e) {
      console.warn("Creator load failed", e);
    }
  }

  /* -------------------------
     MAP METADATA
  ------------------------- */

  function editMapMetadata8() {
    const name = prompt(
      "Map name:",
      M8.mapData.name
    );

    if (name === null) return;

    const description = prompt(
      "Map description:",
      M8.mapData.description
    );

    if (description === null) return;

    const tags = prompt(
      "Tags separated by commas:",
      M8.mapData.tags.join(", ")
    );

    pushHistory8();

    M8.mapData.name =
      name.trim().slice(0, 60) ||
      "Untitled Map";

    M8.mapData.description =
      description.trim().slice(0, 300);

    M8.mapData.tags =
      tags
        .split(",")
        .map(t => t.trim())
        .filter(Boolean)
        .slice(0, 10);

    M8.mapData.version++;

    saveCreatorState8();

    updateBuilderUI8();

    notify8("Map info updated");
  }

  /* -------------------------
     PUBLISH FOUNDATION
  ------------------------- */

  function publishMap8() {
    if (!M8.permissions.publish) {
      notify8(
        "Publishing needs server/creator permission"
      );
      return;
    }

    M8.mapData.published = true;
    M8.mapData.version++;

    saveCreatorState8();

    if (
      window.MonkeyVROnline &&
      typeof window.MonkeyVROnline.sendPacket ===
        "function"

        type: "map_publish_request",
        map: getMapPackage8()

    notify8("Publish request sent");

  function escape8(value) {
    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");

  function useTool8(tool) {
    M8.currentTool = tool;

    const object = selectedObject8();

    if (
      tool !== "select" &&
      !object
    ) {
      notify8("Select an object first");
      return;
    }

    switch (tool) {
      case "move":
        moveSelected8(0, M8.grid, 0);
        break;

      case "rotate":
        rotateSelected8(
          0,
          M8.rotationSnap,
          0
        );
        break;

      case "scale":
        scaleSelected8(
          1.1,
          1.1,
          1.1
        );
        break;

      case "delete":
        deleteSelected8();
        break;

      case "duplicate":
        duplicateSelected8();
        break;

      case "select":
        notify8("Select mode");
        break;
    }
  }

  function performAction8(action) {
    switch (action) {
      case "undo":
        undo8();
        break;

      case "redo":
        redo8();
        break;

      case "copy":
        copySelected8();
        break;

      case "paste":
        paste8();
        break;

      case "lock":
        toggleLock8();
        break;

      case "visibility":
        toggleVisibility8();
        break;

    updateBuilderUI8();

  /* -------------------------
     KEYBOARD CONTROLS
  ------------------------- */

  window.addEventListener(
    "keydown",
    event => {
      if (
        event.target &&
        (
          event.target.tagName === "INPUT" ||
          event.target.tagName === "TEXTAREA" ||
          event.target.tagName === "SELECT"
        )
      ) {
        return;
      }

      switch (
        event.key.toLowerCase()
      ) {
        case "b":
          if (M8.builderOpen) {
            closeBuilder8();
          } else {
            openBuilder8();
          }
          break;

        case "delete":
        case "backspace":
          if (M8.builderOpen) {
            deleteSelected8();
          }
          break;

        case "escape":
          if (M8.builderOpen) {
            M8.selected = null;
            updateBuilderUI8();
          }
          break;

        case "z":
          if (event.ctrlKey) {
            event.preventDefault();
            undo8();
          }
          break;

        case "y":
          if (event.ctrlKey) {
            event.preventDefault();
            redo8();
          }
          break;

        case "c":
          if (event.ctrlKey) {
            event.preventDefault();
            copySelected8();
          }
          break;

        case "v":
          if (event.ctrlKey) {
            event.preventDefault();
            paste8();
          }
          break;
      }
    }
  );

    scene.addEventListener(

        if (!target) return;

        const id =
          target.dataset?.creatorObject;

        if (!id) return;

        const object =
          M8.objects.find(

        selectObject8(id);

        if (
          M8.testMode &&
          object.type === "button"

          activateCreatorButton8(
            object

      }
    );

    return {
      version:
        Number(M8.mapData.version || 1),
      timestamp: Date.now(),
      note:
        String(note || "Map update")
          .slice(0, 120),
      package: getMapPackage8()
    };

    M8.mapData.versions || [];

  function saveVersion8(note) {
    if (!Array.isArray(
      M8.mapData.versions
    )) {
      M8.mapData.versions = [];
    }

    M8.mapData.versions.push(
      createVersion8(note)
    );

    if (
      M8.mapData.versions.length > 20
    ) {
      M8.mapData.versions.shift();
    }

    saveCreatorState8();

    notify8("Version saved");
  }

  function restoreVersion8(index) {
    const versions =
      M8.mapData.versions || [];

      versions[index];

    if (!version) return;

    applyMapPackage8(
      version.package

    notify8(
      "Restored version " +
      version.version

        navigator.clipboard.writeText
      ) {
        navigator.clipboard
          .writeText(data)
          .then(() => {
            notify8(
              "Map data copied"
            );

          .catch(() => {
            prompt(
              "Copy this map data:",
              data
            );
          });
      } else {
        prompt(

          data
        );
      }
    } catch (e) {
      prompt(
        "Copy this map data:",
        data
      );
    }
  }

  /* -------------------------

  ------------------------- */

  let last8 = performance.now();

  function creatorLoop8(now) {
    const dt =
      clamp8(
        (now - last8) / 1000,
        0,
        .1
      );

    last8 = now;

  /* -------------------------------------------------------
     SETTINGS SAVE
  ------------------------------------------------------- */

  function saveFinalSettings10() {
    try {
      localStorage.setItem(
        "MonkeyVR_FinalSettings",
        JSON.stringify({
          performanceMode:
            M10.performanceMode,
          quality:
            M10.quality,
          notifications:
            M10.notifications,
          debug:
            M10.debug
        })
      );
    } catch (e) {
      console.warn(
        "Settings save failed",
        e
      );
    }
  }

  function loadFinalSettings10() {
    try {
      const raw =
        localStorage.getItem(
          "MonkeyVR_FinalSettings"
        );

      if (!raw) return;

      const data =
        JSON.parse(raw);

      M10.performanceMode =
        data.performanceMode ||
        "auto";

      M10.quality =
        data.quality ||
        "high";

      if (
        typeof data.notifications ===
        "boolean"
      ) {
        M10.notifications =
          data.notifications;
      }

      if (
        typeof data.debug ===
        "boolean"
      ) {
        M10.debug =
          data.debug;
      }
    } catch (e) {
      console.warn(
        "Settings load failed",
        e
      );
    }
  }

        event.target &&

            "INPUT" ||
          event.target.tagName ===
            "TEXTAREA" ||
          event.target.tagName ===
            "SELECT"
        )
      ) {
        return;
      }

      if (
        event.key === "Escape" &&
        M10.menuOpen
      ) {
        closeFinalMenu10();
      }

      if (
        event.key.toLowerCase() ===
        "m"
      ) {
        if (
          M10.menuOpen

          closeFinalMenu10();
        } else {
          openFinalMenu10();
        }

  /* -------------------------------------------------------
     SESSION STATS
  ------------------------------------------------------- */

  function updateSessionStats10() {
    const game =
      window.Game;

    if (
      game?.stats
    ) {
      if (
        typeof game.stats.rounds ===
        "number"
      ) {
        M10.session.rounds =
          game.stats.rounds;
      }

      if (
        typeof game.stats.tags ===
        "number"
      ) {
        M10.session.tags =
          game.stats.tags;
      }

      if (
        typeof game.stats.jumps ===
        "number"
      ) {
        M10.session.jumps =
          game.stats.jumps;
      }
    }

    const creator =
      window.MonkeyVRCreator;

    if (
      creator?.state?.objects
    ) {
      M10.session.objectsBuilt =
        creator.state.objects.length;
    }
  }

  function formatTime10(ms) {
    const seconds =
      Math.floor(
        ms / 1000
      );

    const minutes =
      Math.floor(
        seconds / 60
      );

    const hours =
      Math.floor(
        minutes / 60
      );

    if (hours > 0) {
      return (
        hours +
        "h " +
        (minutes % 60) +
        "m"
      );
    }

    return (
      minutes +
      "m"
    );
  }

  /* -------------------------------------------------------
     FINAL LOOP
  ------------------------------------------------------- */

  let last10 =
    performance.now();

  function finalLoop10(now) {
    updatePerformance10(
      now
    );

    updateSessionStats10();

    if (
      now - last10 >
      1000
    ) {
      applyPerformance10();
      updatePerformanceInfo10();
      last10 = now;
    }

    requestAnimationFrame(
      finalLoop10
    );
  }

  /* -------------------------------------------------------
     STARTUP
  ------------------------------------------------------- */

  function finalStartup10() {
    if (M10.booted) return;

    M10.booted =
      true;

    loadFinalSettings10();

    createFinalMenu10();

    createMobileMenuButton10();

    integrateVRMenu10();

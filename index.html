<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Monkey Mod Sandbox V1</title>

  <style>
    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    #menu {
      width: 280px;
      margin: 80px auto;
      padding: 25px;
      background: #202020;
      border-radius: 20px;
      box-shadow: 0 0 25px #000;
    }

    h1 {
      margin-top: 0;
    }

    button {
      width: 100%;
      padding: 16px;
      margin: 8px 0;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      font-weight: bold;
      background: #333;
      color: white;
    }

    button.on {
      background: #35b85a;
    }

    #status {
      margin-top: 15px;
      color: #aaa;
    }
  </style>
</head>

<body>

<div id="menu">
  <h1>🦍 MONKEY MENU</h1>

  <button id="speed">⚡ Speed: OFF</button>
  <button id="jump">🦘 Super Jump: OFF</button>

  <div id="status">
    V1 Sandbox
  </div>
</div>

<script>
  let speed = false;
  let superJump = false;

  const speedButton = document.getElementById("speed");
  const jumpButton = document.getElementById("jump");

  speedButton.onclick = function() {
    speed = !speed;

    speedButton.textContent =
      "⚡ Speed: " + (speed ? "ON" : "OFF");

    speedButton.classList.toggle("on", speed);
  };

  jumpButton.onclick = function() {
    superJump = !superJump;

    jumpButton.textContent =
      "🦘 Super Jump: " + (superJump ? "ON" : "OFF");

    jumpButton.classList.toggle("on", superJump);
  };
</script>

</body>
</html>

      "npc_" +
      M6.npc.nextId++;

    const p =
      position || {
        x:
          Math.random() *
            12 -
          6,

        y:
          1,

        z:
          Math.random() *
            12 -
          6
      };

    npc.id =
      id;

    npc.setAttribute(
      "position",
      `${p.x} ${p.y} ${p.z}`
    );

    npc.setAttribute(
      "geometry",
      "primitive: sphere; radius: .45"
    );

    npc.setAttribute(
      "material",
      "color:#ffffff"
    );

    npc.dataset.npc =
      "true";

    s.appendChild(
      npc
    );

    const data = {
      id,
      entity: npc,
      type,
      health:
        options.health ||
        100,

      speed:
        options.speed ||
        (
          type === "chase"
            ? 2.8
            : 1.5
        ),

      detection:
        options.detection ||
        12,

      state:
        "idle",

      target: null,

      patrolTarget: null,

      attackCooldown: 0
    };

    M6.npc.list.push(
      data
    );

    return data;
  }

  function removeNPC(
    npc
  ) {
    if (!npc) return;

    if (
      npc.entity &&
      npc.entity.parentNode
    ) {
      npc.entity.parentNode
        .removeChild(
          npc.entity
        );
    }

    M6.npc.list =
      M6.npc.list.filter(
        x =>
          x !== npc
      );
  }

  function updateNPCs(
    dt
  ) {
    const p =
      playerPosition();

    M6.npc.list
      .forEach(
        npc => {
          if (
            !npc.entity
          ) return;

          const pos =
            getPosition(
              npc.entity
            );

          const d =
            distance(
              p,
              pos
            );

          if (
            npc.type ===
              "chase" ||
            npc.type ===
              "boss"
          ) {
            if (
              d <=
              npc.detection
            ) {
              npc.target =
                p;

              npc.state =
                "chasing";
            } else {
              npc.state =
                "patrol";
            }
          }

          if (
            npc.type ===
            "flee"
          ) {
            if (
              d < 8
            ) {
              npc.target =
                {
                  x:
                    pos.x +
                    (
                      pos.x -
                      p.x
                    ),

                  y:
                    pos.y,

                  z:
                    pos.z +
                    (
                      pos.z -
                      p.z
                    )
                };

              npc.state =
                "fleeing";
            }
          }

          if (
            npc.target
          ) {
            const target =
              npc.target;

            const dx =
              target.x -
              pos.x;

            const dz =
              target.z -
              pos.z;

            const len =
              Math.sqrt(
                dx * dx +
                dz * dz
              );

            if (
              len >
              0.2
            ) {
              const speed =
                npc.speed *
                dt;

              pos.x +=
                dx /
                len *
                speed;

              pos.z +=
                dz /
                len *
                speed;

              setPosition(
                npc.entity,
                pos
              );
            }
          }

          if (
            npc.attackCooldown >
            0
          ) {
            npc.attackCooldown -=
              dt;
          }

          if (
            npc.type ===
              "chase" &&
            d < 1.2 &&
            npc.attackCooldown <=
              0
          ) {
            playerDamage(
              10
            );

            npc.attackCooldown =
              1.5;
          }
        }
      );

  function playerDamage(
    amount
  ) {
    M6.player.health =
      clamp(
        M6.player.health -
          Math.max(
            0,
            amount
          ),
        0,
        M6.player.maxHealth
      );

    if (
      M6.player.health <=
      0
    ) {
      playerRespawn();
    }
  }

  function playerHeal(
    amount
  ) {
    M6.player.health =
      clamp(
        M6.player.health +
          Math.max(
            0,
            amount
          ),
        0,
        M6.player.maxHealth
      );
  }

  function playerRespawn() {
    M6.player.health =
      M6.player.maxHealth;

    setVelocity(
      0,
      0,
      0
    );

    if (
      typeof resetPlayer ===
      "function"
    ) {
      resetPlayer();
    } else {
      const r =
        rig();

      if (r) {
        setPosition(
          r,
          {
            x: 0,
            y: 1.6,
            z: 0
          }
        );
      }
    }

    msg6(
      "💥 Respawned!"

     ======================================================== */

  function spawnBoss(
    name = "Guardian"
  ) {
    const boss =
      spawnAdvancedNPC(
        "boss",
        {
          x: 0,
          y: 2,
          z: -8
        },
        {
          health: 1000,
          speed: 1.8,
          detection: 30
        }
      );

    if (!boss)
      return null;

    boss.name =
      name;

    boss.maxHealth =
      1000;

    boss.phase =
      1;

    M6.bosses.active.push(
      boss
    );

    msg6(
      "👑 BOSS SPAWNED: " +
      name,
      3500
    );

    return boss;
  }

  function damageBoss(
    boss,
    amount
  ) {
    if (!boss) return;

    boss.health -=
      Math.max(
        0,
        amount
      );

    if (
      boss.health <=
      0
    ) {
      defeatBoss(
        boss
      );
      return;
    }

    const ratio =
      boss.health /
      boss.maxHealth;

    if (
      ratio < 0.66 &&
      boss.phase === 1
    ) {
      boss.phase =
        2;

      boss.speed *=
        1.25;

      msg6(
        "⚠️ BOSS PHASE 2!"
      );
    }

    if (
      ratio < 0.33 &&
      boss.phase === 2
    ) {
      boss.phase =
        3;

      boss.speed *=
        1.35;

      msg6(
        "🔥 BOSS FINAL PHASE!"
      );
    }
  }

  function defeatBoss(
    boss
  ) {
    msg6(
      "🏆 BOSS DEFEATED!"
    );

    if (
      typeof addXP ===
      "function"
    ) {
      addXP(
        500,
        "Boss defeated"
      );
    }

    if (
      typeof MonkeyVRShop !==
      "undefined"
    ) {
      MonkeyVRShop.addCoins(
        500,
        "Boss reward"
      );
    }

    removeNPC(
      boss
    );

    M6.bosses.active =
      M6.bosses.active
        .filter(
          x =>
            x !== boss
        );
  }

  const EVENT_LIST = [
    "Meteor Shower",
    "Blackout",
    "Super Gravity",

    "Speed Boost",
    "Giant World",
    "Tiny World",

  function startEvent(
    name
  ) {
    if (
      M6.events.active
    ) {
      msg6(
        "⚠️ Another event is already active."
      );
      return;
    }

    M6.events.active =
      name;

    M6.events.timer =
      15;

    switch (name) {

      case "Meteor Shower":
        startMeteorEvent();
        break;

      case "Blackout":
        startBlackoutEvent();
        break;

      case "Super Gravity":
        setGravityMultiplier(
          2
        );
        break;

      case "Moon Gravity":
        setGravityMultiplier(
          0.2
        );
        break;

      case "Speed Boost":
        M6.movement.speed *=
          1.8;
        break;

      case "Giant World":
        setWorldScale(
          1.6
        );
        break;

      case "Tiny World":
        setWorldScale(
          0.65
        );
        break;

      case "Rising Lava":
        startLavaEvent();
        break;

      case "Treasure Hunt":
        spawnTreasureEvent();
        break;

      case "NPC Invasion":
        for (
          let i = 0;
          i < 8;
          i++
        ) {
          spawnAdvancedNPC(
            "chase"
          );
        }
        break;

      case "Portal Storm":
        spawnPortalStorm();
        break;

      case "Boss Alert":
        spawnBoss(
          "The Guardian"
        );
        break;

      case "Zero Gravity":
        setGravityMultiplier(
          0
        );
        break;
    }

    msg6(
      "🌎 EVENT: " +
      name,
      3500
    );
  }

  function endEvent() {
    if (
      !M6.events.active
    ) return;

    const name =
      M6.events.active;

    M6.events.active =
      null;

    M6.events.timer =
      0;

    setGravityMultiplier(
      1
    );

    setWorldScale(
      1
    );

    msg6(
      "✅ Event ended: " +
      name
    );
  }

  function spawnMeteor() {
    const s =
      scene();

    if (!s) return;

    const meteor =
      document.createElement(
        "a-sphere"
      );

    meteor.setAttribute(
      "radius",
      ".35"
    );

    meteor.setAttribute(
      "material",
      "color:#ff5500; emissive:#ff2200"
    );

    const p = {
      x:
        Math.random() *
          24 -
        12,

      y:
        12 +
        Math.random() *
          8,

      z:
        Math.random() *
          24 -
        12
    };

    meteor.setAttribute(
      "position",
      `${p.x} ${p.y} ${p.z}`
    );

    s.appendChild(
      meteor
    );

    const interval =
      setInterval(
        () => {
          const pos =
            getPosition(
              meteor
            );

          pos.y -=
            0.35;

          setPosition(
            meteor,
            pos
          );

          if (
            pos.y <
            0
          ) {
            if (
              meteor.parentNode
            ) {
              meteor.parentNode
                .removeChild(
                  meteor
                );
            }

            clearInterval(
              interval
            );
          }
        },
        40
      );
  }

  /* ========================================================

     ======================================================== */

  function comboAction(
    action
  ) {
    const now =
      Date.now();

    if (
      now -
        M6.combo.lastAction >
      2500
    ) {
      M6.combo.count =
        0;

      M6.combo.multiplier =
        1;
    }

    M6.combo.count++;

    M6.combo.lastAction =
      now;

    M6.combo.multiplier =
      1 +
      Math.floor(
        M6.combo.count / 5
      ) *
        0.25;

    if (
      M6.combo.count >=
      3
    ) {
      msg6(
        "🔥 COMBO x" +
        M6.combo.multiplier.toFixed(
          2
        )
      );
    }

    if (
      M6.combo.count >=
      10
    ) {
      if (
        typeof addXP ===
        "function"
      ) {
        addXP(
          10 *
            M6.combo.multiplier,
          "Movement combo"
        );
      }
    }
  }

  /* ========================================================
     MOVEMENT PHYSICS
     ======================================================== */

  function updatePhysics(
    dt
  ) {
    if (
      !M6.movement.enabled
    ) return;

    const r =
      rig();

    if (!r) return;

    updateSwimming();

    updateGrapple(
      dt
    );

    updateZipline(
      dt
    );

    if (
      M6.player.swimming
    ) {
      M6.player.velocity.y +=
        M6.swimming.buoyancy *
        dt;

      M6.player.velocity.y *=
        0.92;
    } else if (
      !M6.player.climbing
    ) {
      const gravity =
        (
          M6.movement.gravity ||
          -9.8
        ) *
        (
          M6.gravityMultiplier ??
          1
        );

      M6.player.velocity.y +=
        gravity *
        dt;
    }

    if (
      M6.player.wallRunning
    ) {
      M6.player.velocity.y +=
        2 *
        dt;

      M6.player.velocity.y =
        clamp(
          M6.player.velocity.y,
          -1,
          4
        );
    }

    const p =
      getPosition(r);

    p.x +=
      M6.player.velocity.x *
      dt;

    p.y +=
      M6.player.velocity.y *
      dt;

    p.z +=
      M6.player.velocity.z *
      dt;

    if (
      p.y <=
      0.9
    ) {
      p.y =
        0.9;

      if (
        M6.player.velocity.y <
        0
      ) {
        M6.player.velocity.y =
          0;
      }

      M6.player.grounded =
        true;

      M6.player.jumpsLeft =
        M6.movement.doubleJumpCount;
    } else {
      M6.player.grounded =
        false;
    }

    if (
      !M6.player.wallRunning &&
      !M6.player.climbing
    ) {
      M6.player.velocity.x *=
        Math.pow(
          M6.movement.momentumAmount,
          dt * 60
        );

      M6.player.velocity.z *=
        Math.pow(
          M6.movement.momentumAmount,
          dt * 60
        );
    }

    setPosition(
      r,
      p
    );
  }

  /* ========================================================
     STAMINA
     ======================================================== */

  function updateStamina(
    dt
  ) {
    const movingFast =
      Math.abs(
        M6.player.velocity.x
      ) +
      Math.abs(
        M6.player.velocity.z
      ) >
      5;

    if (
      movingFast ||
      M6.player.wallRunning ||
      M6.player.climbing
    ) {
      M6.player.stamina -=
        12 * dt;
    } else {
      M6.player.stamina +=
        18 * dt;
    }

    M6.player.stamina =
      clamp(
        M6.player.stamina,
        0,
        M6.player.maxStamina
      );

    if (
      M6.player.stamina <=
      0
    ) {
      M6.player.wallRunning =
        false;

      M6.player.climbing =
        false;
    }
  }

  /* ========================================================
     MAIN LOOP
     ======================================================== */

  let lastTime =
    performance.now();

  function loop(now) {

    const rawDt =
      Math.min(
        0.05,
        (
          now -
          lastTime
        ) /
        1000
      );

    lastTime =
      now;

    const dt =
      rawDt *
      (
        M6.timeScale ??
        1
      );

    updatePhysics(
      dt
    );

    updateNPCs(
      dt
    );

    updateEvent(
      rawDt
    );

    updateStamina(
      rawDt
    );

    updateHUD();

    requestAnimationFrame(
      loop
    );
  }

    startEvent,
    endEvent,

    playerDamage,
    playerHeal,
    playerRespawn,

    comboAction
  };

  /* ========================================================
     INITIALIZATION
     ======================================================== */

  function initPart6() {
    if (
      M6.initialized
    ) return;

    M6.initialized =
      true;

    M6.gravityMultiplier =
      1;

    M6.timeScale =
      1;

    setupInputs();

    createHUD();

    addAdvancedMenuButtons();

    /*
     * Delay world objects slightly so
     * A-Frame has time to finish loading.
     */
    setTimeout(
      createDefaultAdvancedWorld,
      1000
    );

    msg6(
      "🔥 Part 6 Advanced Gameplay loaded!",
      3000
    );

    requestAnimationFrame(
      loop
    );
  }

  if (
    document.readyState ===
    "loading"
  ) {
    document.addEventListener(
      "DOMContentLoaded",
      initPart6
    );
  } else {
    initPart6();
  }

})();
</script>

</body>
</html>

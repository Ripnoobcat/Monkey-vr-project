<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">
<title>Monkey VR — Sandbox</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#050509;
  font-family:Arial,Helvetica,sans-serif;
  color:white;
}

#game{
  position:fixed;
  inset:0;
}

#loading{
  position:fixed;
  inset:0;
  z-index:9999;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  background:#07070b;
  font-weight:bold;
}

#loading h1{
  font-size:42px;
  margin:0 0 12px;
}

#loading p{
  opacity:.7;
}

#hud{
  position:fixed;
  top:14px;
  left:14px;
  z-index:50;
  pointer-events:none;
}

#status{
  padding:9px 12px;
  border-radius:12px;
  background:rgba(0,0,0,.55);
  border:1px solid rgba(255,255,255,.15);
  backdrop-filter:blur(8px);
  font-size:13px;
}

#mobileControls{
  display:none;
  position:fixed;
  inset:0;
  z-index:80;
  pointer-events:none;
}

#joystick{
  position:absolute;
  left:25px;
  bottom:25px;
  width:135px;
  height:135px;
  border-radius:50%;
  background:rgba(255,255,255,.10);
  border:2px solid rgba(255,255,255,.25);
  pointer-events:auto;
  touch-action:none;
}

#stick{
  position:absolute;
  width:58px;
  height:58px;
  left:38px;
  top:38px;
  border-radius:50%;
  background:rgba(255,255,255,.35);
}

.mobileButton{
  position:absolute;
  width:75px;
  height:75px;
  border-radius:50%;
  border:2px solid rgba(255,255,255,.3);
  background:rgba(255,255,255,.12);
  color:white;
  font-weight:bold;
  pointer-events:auto;
  touch-action:none;
}

#jumpButton{
  right:35px;
  bottom:38px;
}

#menuButton{
  right:35px;
  bottom:130px;
}

#actionButton{
  right:125px;
  bottom:75px;
}

#menu{
  display:none;
  position:fixed;
  z-index:200;
  width:min(420px,92vw);
  max-height:78vh;
  overflow:hidden;
  border-radius:24px;
  background:rgba(12,12,20,.94);
  border:2px solid rgba(255,255,255,.18);
  box-shadow:0 25px 80px rgba(0,0,0,.65);
  backdrop-filter:blur(20px);
}

#menuHeader{
  padding:17px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid rgba(255,255,255,.12);
}

#menuTitle{
  font-size:22px;
  font-weight:900;
}

#closeMenu{
  border:0;
  background:rgba(255,255,255,.1);
  color:white;
  border-radius:12px;
  padding:8px 12px;
  font-size:18px;
}

#tabs{
  display:flex;
  gap:7px;
  padding:10px;
  overflow-x:auto;
}

.tab{
  flex:none;
  border:1px solid rgba(255,255,255,.12);
  background:rgba(255,255,255,.06);
  color:white;
  border-radius:12px;
  padding:9px 11px;
  font-weight:bold;
}

.tab.active{
  background:rgba(255,255,255,.22);
}

#menuContent{
  padding:12px;
  overflow-y:auto;
  max-height:58vh;
}

.option{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:12px;
  margin-bottom:8px;
  border-radius:15px;
  background:rgba(255,255,255,.055);
}

.optionInfo{
  min-width:0;
}

.optionName{
  font-weight:800;
}

.optionDesc{
  font-size:11px;
  opacity:.55;
  margin-top:3px;
}

.toggle{
  min-width:54px;
  height:29px;
  border-radius:20px;
  border:0;
  background:#333;
  position:relative;
}

.toggle::after{
  content:"";
  position:absolute;
  top:4px;
  left:4px;
  width:21px;
  height:21px;
  border-radius:50%;
  background:white;
  transition:.15s;
}

.toggle.on{
  background:#45d483;
}

.toggle.on::after{
  left:29px;
}

.action{
  width:100%;
  border:0;
  border-radius:14px;
  padding:12px;
  background:rgba(255,255,255,.10);
  color:white;
  font-weight:bold;
}

.action:active{
  transform:scale(.98);
}

.select{
  background:#222;
  color:white;
  border:1px solid #444;
  border-radius:10px;
  padding:8px;
}

#toast{
  position:fixed;
  left:50%;
  bottom:30px;
  transform:translateX(-50%) translateY(30px);
  opacity:0;
  z-index:1000;
  background:rgba(0,0,0,.85);
  border:1px solid rgba(255,255,255,.2);
  padding:12px 17px;
  border-radius:14px;
  transition:.2s;
  pointer-events:none;
}

#toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

#mobileMode{
  display:none;
}

@media(pointer:coarse){
  #mobileControls{
    display:block;
  }

  #mobileMode{
    display:block;
  }
}
</style>

<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.min.js"></script>
</head>

<body>

<div id="game">

<a-scene
  renderer="antialias:true;
            colorManagement:true;
            physicallyCorrectLights:true"
  vr-mode-ui="enabled:true"
  background="color:#15151c">

  <a-assets>

    <a-asset-item id="dummy"></a-asset-item>

  </a-assets>

  <!-- LIGHTING -->

  <a-entity light="
      type:ambient;
      color:#ffffff;
      intensity:1.2">
  </a-entity>

  <a-entity
      id="sun"
      light="
        type:directional;
        color:#ffffff;
        intensity:1.4"
      position="5 12 -4">
  </a-entity>

  <!-- WORLD -->

  <a-entity id="world">

    <!-- FLOOR -->

    <a-box
      id="floor"
      position="0 -0.15 0"
      width="40"
      height=".3"
      depth="40"
      color="#3c7d42"
      shadow>
    </a-box>

    <!-- CENTRAL STUMP -->

    <a-cylinder
      id="stump"
      position="0 1 0"
      radius="2.2"
      height="2"
      color="#714628"
      shadow>
    </a-cylinder>

    <a-cylinder
      position="0 2.02 0"
      radius="2.28"
      height=".08"
      color="#9b663c">
    </a-cylinder>

    <!-- TREES -->

    <a-entity class="tree" position="-7 0 -7">
      <a-cylinder radius=".65" height="5" color="#60391f"></a-cylinder>
      <a-sphere position="0 3.3 0" radius="2.4" color="#28753b"></a-sphere>
      <a-sphere position="1 4 0" radius="1.7" color="#32864a"></a-sphere>
    </a-entity>

    <a-entity class="tree" position="7 0 -7">
      <a-cylinder radius=".65" height="5" color="#60391f"></a-cylinder>
      <a-sphere position="0 3.3 0" radius="2.4" color="#28753b"></a-sphere>
      <a-sphere position="-1 4 0" radius="1.7" color="#32864a"></a-sphere>
    </a-entity>

    <a-entity class="tree" position="-8 0 7">
      <a-cylinder radius=".65" height="5" color="#60391f"></a-cylinder>
      <a-sphere position="0 3.3 0" radius="2.4" color="#28753b"></a-sphere>
      <a-sphere position="1 4 0" radius="1.7" color="#32864a"></a-sphere>
    </a-entity>

    <a-entity class="tree" position="8 0 7">
      <a-cylinder radius=".65" height="5" color="#60391f"></a-cylinder>
      <a-sphere position="0 3.3 0" radius="2.4" color="#28753b"></a-sphere>
      <a-sphere position="-1 4 0" radius="1.7" color="#32864a"></a-sphere>
    </a-entity>

    <!-- PARKOUR PLATFORMS -->

    <a-box
      class="platform"
      position="-4 1 -3"
      scale="3 .35 2"
      color="#8b6546">
    </a-box>

    <a-box
      class="platform"
      position="4 2 -4"
      scale="3 .35 2"
      color="#8b6546">
    </a-box>

    <a-box
      class="platform"
      position="-5 3 3"
      scale="2 .35 2"
      color="#8b6546">
    </a-box>

    <a-box
      class="platform"
      position="5 4 3"
      scale="2 .35 2"
      color="#8b6546">
    </a-box>

    <!-- BRIDGES -->

    <a-box
      position="0 3 -7"
      scale="7 .25 .7"
      color="#68442c">
    </a-box>

    <a-box
      position="0 5 7"
      scale="7 .25 .7"
      color="#68442c">
    </a-box>

    <!-- WALLS -->

    <a-box
      position="-11 2 0"
      scale=".5 4 10"
      color="#554333">
    </a-box>

    <a-box
      position="11 2 0"
      scale=".5 4 10"
      color="#554333">
    </a-box>

    <a-box
      position="0 2 -11"
      scale="10 4 .5"
      color="#554333">
    </a-box>

    <a-box
      position="0 2 11"
      scale="10 4 .5"
      color="#554333">
    </a-box>

  </a-entity>

  <!-- PLAYER RIG -->

  <a-entity
    id="playerRig"
    position="0 1.6 5">

    <a-camera
      id="camera"
      position="0 0 0"
      look-controls="enabled:true">
    </a-camera>

    <!-- LEFT HAND -->

    <a-entity
      id="leftHand"
      laser-controls="hand:left"
      hand-controls="hand:left"
      raycaster="
        objects:.menuButton;
        far:10"
      line="
        color:#ffffff;
        opacity:.75">
    </a-entity>

    <!-- RIGHT HAND -->

    <a-entity
      id="rightHand"
      laser-controls="hand:right"
      hand-controls="hand:right"
      raycaster="
        objects:.menuButton;
        far:10"
      line="
        color:#ffffff;
        opacity:.75">
    </a-entity>

  </a-entity>

</a-scene>

</div>

<div id="loading">
  <h1>🐒 MONKEY VR</h1>
  <p>Loading sandbox...</p>
</div>

<div id="hud">
  <div id="status">
    MONKEY VR • <span id="modeStatus">SANDBOX</span>
  </div>
</div>

<div id="mobileControls">

  <div id="joystick">
    <div id="stick"></div>
  </div>

  <button
    class="mobileButton"
    id="jumpButton">
    JUMP
  </button>

  <button
    class="mobileButton"
    id="menuButton">
    MENU
  </button>

  <button
    class="mobileButton"
    id="actionButton">
    ACT
  </button>

</div>

<div id="menu">

  <div id="menuHeader">

    <div id="menuTitle">
      MONKEY MENU
    </div>

    <button id="closeMenu">
      ✕
    </button>

  </div>

  <div id="tabs"></div>

  <div id="menuContent"></div>

</div>

<div id="toast"></div>

<script>

/* =========================================================
   MONKEY VR
   CORE ENGINE
   ========================================================= */

const Game = {

  version: "0.1.0",

  player: {
    name: "Monkey",
    level: 1,
    xp: 0,
    coins: 500,
    speed: 4.2,
    jumpPower: 5,
    gravity: -9.8,
    velocity: new THREE.Vector3(),
    grounded: true,
    stamina: 100
  },

  state: {

    menuOpen:false,

    movement:{
      armSwing:true,
      momentum:true,
      airControl:true,
      wallClimb:false,
      wallJump:false,
      wallRun:false,
      doubleJump:false,
      superJump:false,
      dash:false,
      grapple:false,
      teleport:false,
      fly:false,
      noclip:false,
      superSpeed:false,
      slowMotion:false,
      moonGravity:false,
      zeroGravity:false,
      longArms:false
    },

    visual:{
      outlines:false,
      particles:true,
      weather:true,
      dayNight:true,
      fpsMode:false
    },

    fun:{
      giant:false,
      tiny:false,
      randomPower:false,
      chaos:false,
      freezeTime:false,
      shockwave:false,
      magnetHands:false,
      objectLauncher:false
    },

    world:{
      weather:"clear",
      time:"day",
      gravity:1,
      event:"none"
    },

    settings:{
      theme:"Classic",
      haptics:true,
      sound:true,
      uiScale:1
    },

    multiplayer:{
      online:false,
      room:"LOCAL",
      players:1
    }

  },

  stats:{
    distance:0,
    jumps:0,
    tags:0,
    wins:0,
    falls:0,
    playTime:0
  },

  inventory:{
    cosmetics:[],
    equipped:[],
    collectibles:[],
    powers:[]
  },

  achievements:[],

  map:"V-Stump",

  mode:"Sandbox"

};


/* =========================================================
   DOM
   ========================================================= */

const scene =
  document.querySelector("a-scene");

const rig =
  document.getElementById("playerRig");

const camera =
  document.getElementById("camera");

const leftHand =
  document.getElementById("leftHand");

const rightHand =
  document.getElementById("rightHand");

const menu =
  document.getElementById("menu");

const tabs =
  document.getElementById("tabs");

const content =
  document.getElementById("menuContent");

const toast =
  document.getElementById("toast");

const status =
  document.getElementById("modeStatus");


/* =========================================================
   UTILS
   ========================================================= */

function clamp(v,min,max){
  return Math.max(min,Math.min(max,v));
}

function toastMessage(message){

  toast.textContent = message;
  toast.classList.add("show");

  clearTimeout(toastMessage.timer);

  toastMessage.timer =
    setTimeout(()=>{
      toast.classList.remove("show");
    },1800);
}

function saveGame(){

  localStorage.setItem(
    "monkeyVRSave",
    JSON.stringify(Game)
  );

}

function loadGame(){

  try{

    const raw =
      localStorage.getItem("monkeyVRSave");

    if(!raw) return;

    const saved =
      JSON.parse(raw);

    if(saved.player)
      Object.assign(Game.player,saved.player);

    if(saved.stats)
      Object.assign(Game.stats,saved.stats);

    if(saved.inventory)
      Object.assign(Game.inventory,saved.inventory);

  }catch(e){

    console.warn("Save failed",e);

  }

}

function xp(amount){

  Game.player.xp += amount;

  const needed =
    Game.player.level * 100;

  if(Game.player.xp >= needed){

    Game.player.xp -= needed;
    Game.player.level++;

    toastMessage(
      "LEVEL UP! Level " +
      Game.player.level
    );

  }

  saveGame();

}


/* =========================================================
   MENU SYSTEM
   ========================================================= */

const pages = {

  MOVEMENT: [

    ["armSwing","Arm Swing","Gorilla-style arm movement"],
    ["momentum","Momentum","Keep movement momentum"],
    ["airControl","Air Control","Control yourself in the air"],
    ["wallClimb","Wall Climb","Experimental climbing"],
    ["wallJump","Wall Jump","Jump away from walls"],
    ["wallRun","Wall Run","Run along surfaces"],
    ["doubleJump","Double Jump","Jump twice"],
    ["superJump","Super Jump","Higher jumping"],
    ["dash","Dash","Quick movement burst"],
    ["superSpeed","Super Speed","Increase movement speed"],
    ["slowMotion","Slow Motion","Slow the world"],
    ["moonGravity","Moon Gravity","Low gravity"],
    ["zeroGravity","Zero Gravity","Almost no gravity"],
    ["fly","Fly","Experimental flying"],
    ["teleport","Teleport","Teleport movement"],
    ["longArms","Long Arms","Sandbox arm length"]

  ],

  VISUAL: [

    ["outlines","Player Outlines","Highlight entities"],
    ["particles","Particles","Enable visual effects"],
    ["weather","Weather","Enable weather"],
    ["dayNight","Day/Night","Dynamic lighting"],
    ["fpsMode","Performance Mode","Reduce effects"]

  ],

  FUN: [

    ["giant","Giant Mode","Become huge"],
    ["tiny","Tiny Mode","Become tiny"],
    ["randomPower","Random Power","Receive random powers"],
    ["chaos","Chaos Mode","Random world effects"],
    ["freezeTime","Freeze Time","Freeze moving objects"],
    ["shockwave","Shockwave","Create a shockwave"],
    ["magnetHands","Magnet Hands","Attract nearby objects"],
    ["objectLauncher","Object Launcher","Launch sandbox objects"]

  ],

  WORLD: [

    ["weatherAction","Weather","Change world weather"],
    ["timeAction","Time","Change world time"],
    ["eventAction","Random Event","Trigger world event"],
    ["mapAction","Map","Change map"],
    ["gravityAction","Gravity","Change world gravity"]

  ],

  PLAYER: [

    ["stats","View Stats","Show player statistics"],
    ["inventory","Inventory","Open inventory"],
    ["achievements","Achievements","View achievements"],
    ["home","Personal Home","Open your home"],
    ["profile","Profile","View player profile"]

  ],

  SETTINGS: [

    ["theme","Menu Theme","Change menu theme"],
    ["haptics","Haptics","Controller feedback"],
    ["sound","Sound","Game audio"],
    ["performance","Performance","Graphics settings"],
    ["save","Save Game","Save locally"],
    ["reset","Reset Save","Delete local progress"]

  ],

  MULTIPLAYER: [

    ["room","Room Code","Current room"],
    ["createRoom","Create Room","Create a local room"],
    ["joinRoom","Join Room","Join using a code"],
    ["playerList","Players","View players"],
    ["private","Private Room","Toggle private room"]

  ],

  CHAT: [

    ["chat","Text Chat","Open chat"],
    ["quickChat","Quick Chat","Quick messages"],
    ["mute","Mute","Mute player audio"],
    ["voice","Voice Chat","Voice system status"]

  ]

};

let currentPage = "MOVEMENT";


function buildTabs(){

  tabs.innerHTML = "";

  Object.keys(pages).forEach(page=>{

    const button =
      document.createElement("button");

    button.className =
      "tab" +
      (page===currentPage ? " active":"");

    button.textContent = page;

    button.onclick = ()=>{

      currentPage = page;

      buildTabs();
      buildPage();

    };

    tabs.appendChild(button);

  });

}


function buildPage(){

  content.innerHTML = "";

  pages[currentPage].forEach(item=>{

    const [
      key,
      name,
      description
    ] = item;

    const row =
      document.createElement("div");

    row.className = "option";

    const info =
      document.createElement("div");

    info.className = "optionInfo";

    info.innerHTML = `
      <div class="optionName">${name}</div>
      <div class="optionDesc">${description}</div>
    `;

    row.appendChild(info);

    if(
      currentPage==="WORLD" ||
      currentPage==="PLAYER" ||
      currentPage==="SETTINGS" ||
      currentPage==="MULTIPLAYER" ||
      currentPage==="CHAT"
    ){

      const button =
        document.createElement("button");

      button.className = "action";
      button.style.width = "110px";

      button.textContent =
        getActionLabel(key);

      button.onclick =
        ()=>runAction(key);

      row.appendChild(button);

    }else{

      const button =
        document.createElement("button");

      button.className = "toggle";

      const enabled =
        getNestedState(key);

      if(enabled)
        button.classList.add("on");

      button.onclick = ()=>{

        toggleState(key);

        button.classList.toggle(
          "on",
          getNestedState(key)
        );

      };

      row.appendChild(button);

    }

    content.appendChild(row);

  });

}


function getNestedState(key){

  for(const group of Object.values(
    Game.state
  )){

    if(
      group &&
      typeof group==="object" &&
      key in group &&
      typeof group[key]==="boolean"
    ){

      return group[key];

    }

  }

  return false;

}


function toggleState(key){

  for(const group of Object.values(
    Game.state
  )){

    if(
      group &&
      typeof group==="object" &&
      key in group &&
      typeof group[key]==="boolean"
    ){

      group[key] =
        !group[key];

      applyFeature(key,group[key]);

      saveGame();

      return;

    }

  }

}


function applyFeature(key,value){

  switch(key){

    case "superSpeed":
      Game.player.speed =
        value ? 9 : 4.2;
      break;

    case "slowMotion":
      break;

    case "moonGravity":
      Game.player.gravity =
        value ? -2.5 : -9.8;
      break;

    case "zeroGravity":
      Game.player.gravity =
        value ? 0 : -9.8;
      break;

    case "giant":
      rig.object3D.scale.setScalar(
        value ? 2.5 : 1
      );
      break;

    case "tiny":
      rig.object3D.scale.setScalar(
        value ? .45 : 1
      );
      break;

    case "fly":
      toastMessage(
        value ?
        "Fly enabled" :
        "Fly disabled"
      );
      break;

    case "fpsMode":

      document.body.style.imageRendering =
        value ? "auto":"auto";

      break;

    case "haptics":

      toastMessage(
        value ?
        "Haptics enabled" :
        "Haptics disabled"
      );

      break;

  }

}


function getActionLabel(key){

  const labels = {

    weatherAction:"CHANGE",
    timeAction:"CHANGE",
    eventAction:"START",
    mapAction:"CHANGE",
    gravityAction:"CHANGE",

    stats:"OPEN",
    inventory:"OPEN",
    achievements:"OPEN",
    home:"OPEN",
    profile:"OPEN",

    theme:"CHANGE",
    performance:"CHANGE",
    save:"SAVE",
    reset:"RESET",

    room:"LOCAL",
    createRoom:"CREATE",
    joinRoom:"JOIN",
    playerList:"VIEW",
    private:"TOGGLE",

    chat:"OPEN",
    quickChat:"SEND",
    mute:"MUTE",
    voice:"VOICE"

  };

  return labels[key] || "OPEN";

}


function runAction(key){

  switch(key){

    case "weatherAction":
      cycleWeather();
      break;

    case "timeAction":
      cycleTime();
      break;

    case "eventAction":
      randomEvent();
      break;

    case "mapAction":
      cycleMap();
      break;

    case "gravityAction":
      cycleGravity();
      break;

    case "stats":
      showStats();
      break;

    case "inventory":
      showInventory();
      break;

    case "achievements":
      showAchievements();
      break;

    case "home":
      openHome();
      break;

    case "profile":
      showProfile();
      break;

    case "theme":
      cycleTheme();
      break;

    case "performance":
      cyclePerformance();
      break;

    case "save":
      saveGame();
      toastMessage("Game saved!");
      break;

    case "reset":

      if(
        confirm(
          "Reset your local save?"
        )
      ){

        localStorage.removeItem(
          "monkeyVRSave"
        );

        location.reload();

      }

      break;

    case "createRoom":
      createRoom();
      break;

    case "joinRoom":
      joinRoom();
      break;

    case "playerList":
      toastMessage(
        "Local player: " +
        Game.player.name

function updateJoystick(e){

  const rect =
    joystick.getBoundingClientRect();

  const cx =
    rect.left+
    rect.width/2;

  const cy =
    rect.top+
    rect.height/2;

  let x =
    (e.clientX-cx)/50;

  let y =
    (e.clientY-cy)/50;

  const length =
    Math.hypot(x,y);

  if(length>1){

    x/=length;
    y/=length;

  }

  mobileX=x;
  mobileY=y;

  stick.style.transform =
    `translate(${x*35}px,${y*35}px)`;

}


function resetJoystick(){

  joystickActive=false;
  mobileX=0;
  mobileY=0;

  stick.style.transform =
    "translate(0,0)";

}

function jump(){

      Game.player.jumpPower;

    Game.player.grounded=false;

function movementUpdate(dt){

  let x=0;
  let z=0;

  if(keys.KeyW)
    z-=1;

  if(keys.KeyS)
    z+=1;

  if(keys.KeyA)
    x-=1;

  if(keys.KeyD)
    x+=1;

  x+=mobileX;
  z+=mobileY;

  const length =
    Math.hypot(x,z);

  if(length>1){

    x/=length;
    z/=length;

  }

  const speed =
    Game.player.speed;

  const forward =
    new THREE.Vector3();

  camera.object3D.getWorldDirection(
    forward
  );

  forward.y=0;
  forward.normalize();

  const right =
    new THREE.Vector3()
      .crossVectors(
        forward,
        new THREE.Vector3(0,1,0)
      )
      .normalize();

  const movement =
    new THREE.Vector3();

  movement.addScaledVector(
    forward,
    -z
  );

  movement.addScaledVector(
    right,
    x
  );

  if(movement.lengthSq()>0){

    movement.normalize();

    Game.player.velocity.x =
      movement.x * speed;

    Game.player.velocity.z =
      movement.z * speed;

  }else if(
    !Game.state.movement.momentum
  ){

    Game.player.velocity.x=0;
    Game.player.velocity.z=0;

  }

  Game.player.velocity.y +=
    Game.player.gravity *
    Game.state.world.gravity *
    dt;

  const pos =
    rig.object3D.position;

  pos.x +=
    Game.player.velocity.x*dt;

  pos.y +=
    Game.player.velocity.y*dt;

  pos.z +=
    Game.player.velocity.z*dt;

  if(pos.y < 1){

    pos.y=1;

    Game.player.velocity.y=0;

    if(!Game.player.grounded){

      Game.stats.falls++;

    }

    Game.player.grounded=true;

  }

  const boundary=10;

  pos.x =
    clamp(pos.x,-boundary,boundary);

  pos.z =
    clamp(pos.z,-boundary,boundary);

}


/* =========================================================
   BASIC ARM-SWING FRAMEWORK
   ========================================================= */

const previousHands = {
  left:null,
  right:null
};

function getHandPosition(hand){

  if(!hand)
    return null;

  const p =
    new THREE.Vector3();

  hand.object3D.getWorldPosition(p);

  return p;

}


function armSwingUpdate(){

  if(!Game.state.movement.armSwing)
    return;

  const l =
    getHandPosition(leftHand);

  const r =
    getHandPosition(rightHand);

  if(!l || !r)
    return;

  if(
    previousHands.left &&
    previousHands.right
  ){

    const dl =
      l.distanceTo(
        previousHands.left
      );

    const dr =
      r.distanceTo(
        previousHands.right
      );

    const swing =
      (dl+dr)*.5;

    if(
      swing>.025 &&
      Game.player.grounded===false
    ){

      const forward =
        new THREE.Vector3();

      camera.object3D
        .getWorldDirection(
          forward
        );

      forward.y=0;
      forward.normalize();

      const force =
        Math.min(
          swing*18,
          1.8
        );

      Game.player.velocity.x +=
        -forward.x*force;

      Game.player.velocity.z +=
        -forward.z*force;

    }

  }

  previousHands.left =
    l.clone();

  previousHands.right =
    r.clone();

}

/* =========================================================
   GAME LOOP
   ========================================================= */

let lastTime =
  performance.now();

function gameLoop(now){

  const dt =
    Math.min(
      (now-lastTime)/1000,
      .05
    );

  lastTime=now;

  movementUpdate(dt);

  armSwingUpdate();

  updatePerformance();

  Game.stats.playTime += dt;

  Game.stats.distance +=
    Math.abs(
      Game.player.velocity.x
    )*dt +
    Math.abs(
      Game.player.velocity.z
    )*dt;

  requestAnimationFrame(
    gameLoop
  );

}

          "primitive:box",
        scale:
          ".2 2 .2",
        color:
          "#48ff8c"
      },

      portal:{
        geometry:
          "primitive:torus;radius:.8;radiusTubular:.08",
        color:
          "#a44cff"
      },

      light:{
        geometry:
          "primitive:sphere;radius:.15",
        color:
          "#ffffff"
      },

      spawn:{
        geometry:
          "primitive:cylinder;radius:1;height:.05",
        color:
          "#4cffb0"
      }

    };

    const config =
      configs[type] ||
      configs.platform;

    if(config.geometry)
      entity.setAttribute(
        "geometry",
        config.geometry
      );

    if(config.scale)
      entity.setAttribute(
        "scale",
        config.scale
      );

    if(config.rotation)
      entity.setAttribute(
        "rotation",
        config.rotation
      );

    entity.setAttribute(
      "material",
      `color:${config.color}`
    );

    if(type==="jumpPad"){

      entity.classList.add(
        "jumpPad"
      );

    }

    if(type==="checkpoint"){

      entity.classList.add(
        "checkpoint"
      );

    }

    if(type==="portal"){

      entity.classList.add(
        "portal"
      );

    }

  },


  deleteSelected(){

    if(!Game.build.selected)
      return;

    const entity =
      Game.build.selected;

    entity.remove();

    const index =
      Game.build.objects.indexOf(
        entity
      );

    if(index!==-1){

      Game.build.objects.splice(
        index,
        1
      );

    }

    Game.build.selected=null;

    this.saveHistory();

    toastMessage(
      "Object deleted"
    );

  },


  duplicate(){

    const original =
      Game.build.selected;

    if(!original)
      return;

    const type =
      original.dataset.type ||
      "platform";

    const copy =
      this.create(type);

    copy.object3D.position.copy(
      original.object3D.position
    );

    copy.object3D.position.x +=
      Game.build.gridSize;

    Game.build.selected =
      copy;

    this.saveHistory();

  },


  move(x,y,z){

    const object =
      Game.build.selected;

    if(!object)
      return;

    object.object3D.position.x += x;
    object.object3D.position.y += y;
    object.object3D.position.z += z;

    this.snap(object);

  },


  rotate(x,y,z){

    const object =
      Game.build.selected;

    if(!object)
      return;

    object.object3D.rotation.x +=
      THREE.MathUtils.degToRad(x);

    object.object3D.rotation.y +=
      THREE.MathUtils.degToRad(y);

    object.object3D.rotation.z +=
      THREE.MathUtils.degToRad(z);

    if(Game.build.snapRotation){

      const step =
        THREE.MathUtils.degToRad(15);

      object.object3D.rotation.x =
        Math.round(
          object.object3D.rotation.x/step
        )*step;

      object.object3D.rotation.y =
        Math.round(
          object.object3D.rotation.y/step
        )*step;

      object.object3D.rotation.z =
        Math.round(
          object.object3D.rotation.z/step
        )*step;

    }

  },


  scale(amount){

    const object =
      Game.build.selected;

    if(!object)
      return;

    object.object3D.scale.multiplyScalar(
      amount
    );

  },


  snap(object){

    if(!Game.build.grid)
      return;

    const s =
      Game.build.gridSize;

    object.object3D.position.x =
      Math.round(
        object.object3D.position.x/s
      )*s;

    object.object3D.position.y =
      Math.round(
        object.object3D.position.y/s
      )*s;

    object.object3D.position.z =
      Math.round(
        object.object3D.position.z/s
      )*s;

  },


  clear(){

    for(
      const object
      of Game.build.objects
    ){

      object.remove();

    }

    Game.build.objects=[];

    Game.build.selected=null;

    this.saveHistory();

    toastMessage(
      "Build cleared"
    );

  },


  saveHistory(){

    const snapshot =
      Game.build.objects.map(
        object=>({

          type:
            object.dataset.type,

          position:
            object.object3D.position.toArray(),

          rotation:
            object.object3D.rotation.toArray(),

          scale:
            object.object3D.scale.toArray()

        })
      );

    Game.build.history.push(
      snapshot
    );

    if(
      Game.build.history.length>30
    ){

      Game.build.history.shift();

    }

    Game.build.future=[];

  },


  restore(snapshot){

    this.clearWithoutHistory();

    snapshot.forEach(data=>{

      const object =
        this.create(data.type);

      object.object3D.position.fromArray(
        data.position
      );

      object.object3D.rotation.fromArray(
        data.rotation
      );

      object.object3D.scale.fromArray(
        data.scale
      );

    });

  },


  clearWithoutHistory(){

    Game.build.objects.forEach(
      o=>o.remove()
    );

    Game.build.objects=[];

    Game.build.selected=null;

  },


  undo(){

    const history =
      Game.build.history;

    if(history.length<2){

      toastMessage(
        "Nothing to undo"
      );

      return;

    }

    const current =
      history.pop();

    Game.build.future.push(
      current
    );

    const previous =
      history[
        history.length-1
      ];

    this.restore(
      previous
    );

    toastMessage(
      "Undo"
    );

  },


  redo(){

    if(!Game.build.future.length){

      toastMessage(
        "Nothing to redo"
      );

      return;

    }

    const snapshot =
      Game.build.future.pop();

    Game.build.history.push(
      snapshot
    );

    this.restore(
      snapshot
    );

    toastMessage(
      "Redo"
    );

  }

};

/* =========================================================
   BUILD SAVE / LOAD
   ========================================================= */

function serializeBuild(){

  return Game.build.objects.map(
    object=>({

      type:
        object.dataset.type,

      position:
        object.object3D.position.toArray(),

      rotation:
        object.object3D.rotation.toArray(),

      scale:
        object.object3D.scale.toArray()

    })
  );

}


function saveBuild(){

  const name =
    prompt(
      "Name your map:"
    );

  if(!name)
    return;

  const builds =
    JSON.parse(
      localStorage.getItem(
        "monkeyVRBuilds"
      ) || "{}"
    );

  builds[name]={
    name,
    version:1,
    objects:
      serializeBuild(),
    created:
      Date.now()
  };

  localStorage.setItem(
    "monkeyVRBuilds",
    JSON.stringify(builds)
  );

  toastMessage(
    "Map saved: " + name
  );

}


function loadBuild(name){

  const builds =
    JSON.parse(
      localStorage.getItem(
        "monkeyVRBuilds"
      ) || "{}"
    );

  const build =
    builds[name];

  if(!build){

    toastMessage(
      "Map not found"
    );

    return;

  }

  Build.clearWithoutHistory();

  build.objects.forEach(
    data=>{

      const object =
        Build.create(
          data.type
        );

      object.object3D.position.fromArray(
        data.position
      );

      object.object3D.rotation.fromArray(
        data.rotation
      );

      object.object3D.scale.fromArray(
        data.scale
      );

    }
  );

  toastMessage(
    "Loaded " + name
  );

}

/* =========================================================
   WEATHER PARTICLES
   ========================================================= */

const weatherParticles=[];


function clearWeather(){

  while(
    weatherParticles.length
  ){

    const object =
      weatherParticles.pop();

    object.remove();

  }

}


function createWeather(){

  clearWeather();

  const weather =
    Game.state.world.weather;

  if(
    weather==="clear" ||
    !Game.state.visual.weather
  ){

    return;

  }

  const count =
    Game.state.settings.theme==="Minimal"
      ? 100
      : 250;

  for(
    let i=0;
    i<count;
    i++
  ){

    const particle =
      document.createElement(
        "a-entity"
      );

    const x =
      (Math.random()-.5)*30;

    const y =
      Math.random()*15;

    const z =
      (Math.random()-.5)*30;

    particle.setAttribute(
      "position",
      `${x} ${y} ${z}`
    );

    if(weather==="rain"){

      particle.setAttribute(
        "geometry",
        "primitive:box"
      );

      particle.setAttribute(
        "scale",
        ".015 .25 .015"
      );

      particle.setAttribute(
        "material",
        "color:#77aaff"
      );

    }

    else if(weather==="snow"){

      particle.setAttribute(
        "geometry",
        "primitive:sphere;radius:.04"
      );

      particle.setAttribute(
        "material",
        "color:#ffffff"
      );

    }

    else{

      particle.setAttribute(
        "geometry",
        "primitive:sphere;radius:.025"
      );

      particle.setAttribute(
        "material",
        "color:#777777"
      );

    }

    scene.appendChild(
      particle
    );

    weatherParticles.push(
      particle
    );

  }

}


function updateWeather(dt){

  const weather =
    Game.state.world.weather;

  if(
    weather==="clear"
  )
    return;

  weatherParticles.forEach(
    particle=>{

      const p =
        particle.object3D.position;

      if(weather==="rain"){

        p.y -=
          12*dt;

      }

      else if(weather==="snow"){

        p.y -=
          1.5*dt;

        p.x +=
          Math.sin(
            performance.now()*.001+
            p.z
          )*.002;

      }

      else{

        p.y -=
          2*dt;

      }

      if(p.y<0){

        p.y =
          12+Math.random()*5;

        p.x =
          (Math.random()-.5)*30;

        p.z =
          (Math.random()-.5)*30;

      }

    }
  );

}

function startChallenge(id){

  const challenge =
    challenges[id];

  if(!challenge)
    return;

  Game.challenge.active=id;
  Game.challenge.startTime=
    performance.now();
  Game.challenge.elapsed=0;
  Game.challenge.checkpoints=0;
  Game.challenge.target=
    challenge.target;

  toastMessage(
    "🏁 " +
    challenge.name +
    " START!"
  );

}


function stopChallenge(){

  if(!Game.challenge.active)
    return;

  const id =
    Game.challenge.active;

  const time =
    (performance.now()-
     Game.challenge.startTime)/1000;

  const previous =
    Game.challenge.bestTimes[id];

  if(
    previous===undefined ||
    time<previous
  ){

    Game.challenge.bestTimes[id]=
      time;

    toastMessage(
      "🏆 NEW BEST: " +
      time.toFixed(2)+"s"
    );

  }else{

    toastMessage(
      "Finished: " +
      time.toFixed(2)+"s"
    );

  }

  Game.challenge.active=null;

  xp(30);

  saveGame();

}

    "position",
    `${center.x}

    ring
  );

  let scale=.2;

  const timer =
    setInterval(
      ()=>{

        scale+=.18;

        ring.object3D.scale.set(
          scale,
          scale,
          scale
        );

        ring.setAttribute(
          "material",
          "opacity",
          Math.max(
            0,
            1-scale/7
          )
        );

        if(scale>=7){

          clearInterval(timer);

          ring.remove();

        }

      },
      30
    );

  xp(5);

}

/* =========================================================
   DAY/NIGHT CLOCK
   ========================================================= */

let worldClock=8;

function updateWorldClock(dt){

  if(
    !Game.state.visual.dayNight
  )
    return;

  worldClock +=
    dt*.02;

  if(worldClock>=24)
    worldClock=0;

  const normalized =
    (worldClock-6)/12;

  const intensity =
    clamp(
      Math.sin(
        normalized*Math.PI
      ),
      .05,
      1.5
    );

  const sun =
    document.getElementById(
      "sun"
    );

  sun.setAttribute(
    "light",
    `type:directional;
     color:#ffffff;
     intensity:${intensity}`
  );

}

/* =========================================================
   PLAYER INTERACTION
   ========================================================= */

function interact(){

  const forward =
    new THREE.Vector3();

  camera.object3D
    .getWorldDirection(
      forward
    );

  const start =
    camera.object3D
      .getWorldPosition(
        new THREE.Vector3()
      );

  const ray =
    new THREE.Raycaster(
      start,
      forward,
      0,
      8
    );

  const objects =
    scene.object3D
      .children;

  const hits =
    ray.intersectObjects(
      objects,
      true
    );

  if(!hits.length){

    toastMessage(
      "Nothing nearby"
    );

    return;

  }

  let object =
    hits[0].object;

  while(
    object &&
    !object.el
  ){

    object =
      object.parent;

  }

  if(!object)
    return;

  const el =
    object.el;

  if(
    el.classList.contains(
      "practiceTarget"
    )
  ){

    el.emit("click");

  }

  else if(
    el.classList.contains(
      "jumpPad"
    )
  ){

    jump();

  }

  else if(
    el.classList.contains(
      "checkpoint"
    )
  ){

    toastMessage(
      "Checkpoint!"
    );

  }

  else{

    Game.build.selected=el;

    toastMessage(
      "Selected object"
    );

  }

}

  function teleportForward(distance) {
    safe(() => {
      const rig =
        el("rig") ||
        el("playerRig") ||
        document.querySelector("[camera]");

      if (!rig) return;

      const camera =
        document.querySelector("[camera]");

      if (!camera) return;

      const dir = new THREE.Vector3();

      camera.object3D.getWorldDirection(dir);

      dir.y = 0;
      dir.normalize();

      rig.object3D.position.x += dir.x * distance;
      rig.object3D.position.z += dir.z * distance;

      M3.stats.portalsUsed++;
    });
  }

  function createShockwave() {
    safe(() => {
      const sceneEl = document.querySelector("a-scene");

      if (!sceneEl) return;

      const camera =
        document.querySelector("[camera]");

      if (!camera) return;

      const p = camera.object3D.getWorldPosition(
        new THREE.Vector3()
      );

      const wave =
        document.createElement("a-ring");

      wave.setAttribute(
        "position",
        `${p.x} ${Math.max(0,p.y-.8)} ${p.z}`
      );

      wave.setAttribute(
        "rotation",
        "-90 0 0"
      );

      wave.setAttribute(
        "radius-inner",
        ".1"
      );

      wave.setAttribute(
        "radius-outer",
        ".25"
      );

      wave.setAttribute(
        "material",
        "shader: standard; emissive: #ffffff; emissiveIntensity: 3; transparent: true; opacity: .9"
      );

      sceneEl.appendChild(wave);

      let radius = .25;

      const timer = setInterval(() => {
        radius += .35;

        wave.setAttribute(
          "radius-inner",
          radius
        );

        wave.setAttribute(
          "radius-outer",
          radius + .15
        );

        wave.setAttribute(
          "material",
          "opacity",
          Math.max(0, 1 - radius / 12)
        );

        if (radius >= 12) {
          clearInterval(timer);
          wave.remove();
        }
      }, 30);
    });
  }

      setTimeout(() => {

        Game.gravity = 25;

      setTimeout(() => {

        Game.speedMultiplier = 2;
      }

      setTimeout(() => {
        if (typeof Game !== "undefined") {
          Game.speedMultiplier = 1;
        }
      }, 15000);

      const sceneEl = document.querySelector("a-scene");

      if (sceneEl) {
        sceneEl.object3D.scale.set(
          1.35,
          1.35,
          1.35

        setTimeout(() => {
          sceneEl.object3D.scale.set(1,1,1);

          .7,
          .7

        "brightness(.15)";

      setTimeout(() => {
        document.body.style.filter =
          "";
      }, 10000);
    }

    if (event === "Mystery Power") {
      usePower("randomPower");
    }

    if (event === "Portal Outbreak") {
      spawnEventPortals();
    }

    if (event === "Meteor Shower") {
      spawnMeteorShower();
    }

    if (event === "Treasure Hunt") {
      spawnTreasure();
    }

      for (let i = 0; i < 8; i++) {

    addXP(25, event);

  function spawnNPC(type = "training") {
    safe(() => {
      const sceneEl = document.querySelector("a-scene");

      if (!sceneEl) return;

      const npc =
        document.createElement("a-sphere");

      npc.setAttribute(
        "radius",
        ".45"
      );

      npc.setAttribute(
        "position",
        `${(Math.random()-.5)*12} .6 ${(Math.random()-.5)*12}`
      );

      npc.setAttribute(
        "material",
        "shader: standard; roughness: .8"
      );

      npc.classList.add("m3-npc");

      npc.dataset.type = type;

      sceneEl.appendChild(npc);

      M3.npcs.push({
        entity: npc,
        type,
        speed: .01 + Math.random() * .03,
        direction: Math.random() * Math.PI * 2
      });

      npc.addEventListener("click", () => {
        if (type === "training") {
          addXP(10);
          msg("🥊 Training hit!");
        }

        if (type === "friendly") {
          msg("👋 The NPC waved at you!");
        }

        if (type === "chase") {
          msg("🏃 RUN!");
        }
      });
    });
  }

  function updateNPCs() {
    safe(() => {
      M3.npcs.forEach(n => {
        if (!n.entity.parentNode) return;

        const p = n.entity.object3D.position;

        if (n.type === "patrol") {
          p.x += Math.cos(n.direction) * n.speed;
          p.z += Math.sin(n.direction) * n.speed;

          if (Math.abs(p.x) > 12 ||
              Math.abs(p.z) > 12) {
            n.direction += Math.PI;
          }
        }

        if (n.type === "chase") {
          const camera =
            document.querySelector("[camera]");

          if (!camera) return;

          const target =
            camera.object3D.getWorldPosition(
              new THREE.Vector3()
            );

          const dx = target.x - p.x;
          const dz = target.z - p.z;

          const d = Math.hypot(dx, dz);

          if (d > .8 && d < 20) {
            p.x += (dx / d) * n.speed;
            p.z += (dz / d) * n.speed;
          }
        }
      });
    });
  }

  const CHALLENGES = {
    jump: {
      name: "Jump Trial",

  function startChallenge(id) {
    const c = CHALLENGES[id];

    if (!c) return;

    M3.challengeActive = true;
    M3.challengeName = id;
    M3.challengeTimer = c.time;

    msg("🏁 " + c.name + " START!");

    if (id === "target") {
      for (let i = 0; i < 10; i++) {
        spawnTarget();
      }
    }

    const timer = setInterval(() => {
      if (!M3.challengeActive) {
        clearInterval(timer);
        return;
      }

      M3.challengeTimer--;

      if (M3.challengeTimer <= 0) {
        clearInterval(timer);
        finishChallenge();
      }
    }, 1000);
  }

  function finishChallenge() {
    if (!M3.challengeActive) return;

    M3.challengeActive = false;

    M3.stats.challengesCompleted++;

    addXP(100);

    msg(
      "🏁 Challenge complete: " +
      M3.challengeName
    );

    if (M3.challengeName === "speed") {
      unlockAchievement("speed_demon");
    }

    if (M3.challengeName === "parkour") {
      unlockAchievement("parkour_master");
    }

    save();
  }

  function detectPlatform() {

        .toLowerCase();

    if (
      navigator.xr ||
      ua.includes("quest") ||
      ua.includes("oculus")
    ) {
      M4.platform = "vr";
    } else if (
      /iphone|ipad|ipod/.test(ua)
    ) {
      M4.platform = "mobile";
    } else if (
      /android/.test(ua)
    ) {
      M4.platform = "mobile";
    } else if (
      /windows|macintosh|linux/.test(ua)
    ) {
      M4.platform = "pc";
    } else {
      M4.platform = "browser";
    }

    return M4.platform;
  }

  function generateRoomCode() {
    const chars =
      "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

    let result = "";

    for (let i = 0; i < 6; i++) {
      result +=
        chars[
          Math.floor(
            Math.random() *
            chars.length
          )
        ];
    }

    return result;

  function joinRoom(code) {

    ) {

  function makePacket(type, data = {}) {

      player: {

      room: M4.roomCode,

    };

  function connectServer(url) {

      !url ||
      typeof url !== "string"

      m4msg(
        "🌐 Server not configured yet."
      );

      return false;

    if (
      typeof WebSocket === "undefined"
    ) {
      m4msg(
        "❌ WebSocket unavailable."
      );

      return false;
    }

    if (M4.connecting) return false;

    M4.connecting = true;
    M4.network.serverURL = url;

    try {
      M4.socket =
        new WebSocket(url);

      M4.socket.onopen = () => {
        M4.connecting = false;
        M4.connected = true;

        M4.network.reconnectAttempts = 0;

        m4msg(
          "🌐 Connected!"
        );

        sendPacket(
          "player_join",
          {
            username:
              M4.username,
            platform:
              M4.platform
          }
        );

        updateOnlineHUD();
      };

      M4.socket.onmessage = event => {
        handlePacket(event.data);
      };

      M4.socket.onerror = () => {
        M4.connecting = false;

        m4msg(
          "⚠️ Network connection error."
        );
      };

      M4.socket.onclose = () => {
        M4.connecting = false;
        M4.connected = false;

        updateOnlineHUD();

        m4msg(
          "🔌 Disconnected."
        );

        attemptReconnect();
      };

      return true;
    } catch (e) {
      M4.connecting = false;

      console.warn(
        "WebSocket error",
        e
      );

      return false;
    }
  }

  function attemptReconnect() {
    if (
      !M4.network.serverURL
    ) return;

    if (
      M4.network.reconnectAttempts >=
      M4.network.maxReconnectAttempts
    ) {
      return;
    }

    M4.network.reconnectAttempts++;

    const delay =
      Math.min(
        15000,
        1000 *
        Math.pow(
          2,
          M4.network.reconnectAttempts
        )
      );

    setTimeout(() => {
      connectServer(
        M4.network.serverURL
      );
    }, delay);
  }

  function handlePacket(raw) {
    try {
      const packet =
        typeof raw === "string"
          ? JSON.parse(raw)
          : raw;

      if (
        !packet ||
        packet.protocol !==
          "MONKEY-VR"
      ) {
        return;
      }

      M4.stats.packetsReceived++;
      M4.network.lastPacket =
        Date.now();

      switch (packet.type) {

        case "player_join":
          remotePlayerJoin(
            packet
          );
          break;

        case "player_leave":
          remotePlayerLeave(
            packet
          );
          break;

        case "player_state":
          updateRemotePlayer(
            packet
          );
          break;

        case "chat":
          receiveChat(
            packet
          );
          break;

        case "room_state":
          receiveRoomState(
            packet
          );
          break;

        case "party_update":
          receivePartyUpdate(
            packet
          );
          break;

        case "server_message":
          addSystemChat(
            packet.data?.message ||
            "Server message"
          );
          break;

        case "moderation":
          handleModeration(
            packet
          );
          break;

      console.warn(
        "Bad network packet",
        e

    }

      return;

    const d =
      packet.data || {};

    if (d.position) {
      remote.position =
        d.position;

      remote.entity

    return {
      position: {
        x: p.x,
        y: p.y,
        z: p.z
      },

      rotation: {
        x: r.x,
        y: r.y,
        z: r.z
      }
    };

  function addFriend(id, username) {
    if (!id) return;

    if (
      M4.blockedPlayers
        .includes(id)

      m4msg(
        "🚫 This player is blocked."
      );

      return;
    }

    if (
      M4.friends.some(
        f => f.id === id
      )
    ) {
      return;
    }

    M4.friends.push({
      id,
      username:
        username || "Monkey",
      added:
        Date.now()
    });

    m4Save();

    m4msg(
      "👥 Friend added!"
    );

    sendPacket(
      "friend_request",
      {
        targetId: id
      }
    );
  }

  function removeFriend(id) {
    M4.friends =
      M4.friends.filter(
        f => f.id !== id
      );

    m4Save();

    m4msg(
      "👥 Friend removed."
    );
  }

  function addRecentPlayer(player) {
    if (!player?.id) return;

    M4.recentPlayers =
      M4.recentPlayers.filter(
        p => p.id !== player.id
      );

    M4.recentPlayers.unshift({
      id: player.id,
      username:
        player.username ||
        "Monkey"
    });

    M4.recentPlayers =
      M4.recentPlayers.slice(
        0,

  /* ---------------------------------------------------------
     BLOCK / MUTE
     --------------------------------------------------------- */

  function blockPlayer(id) {
    if (!id) return;

    if (
      !M4.blockedPlayers
        .includes(id)
    ) {
      M4.blockedPlayers.push(id);
    }

    M4.moderation.blocked =
      M4.blockedPlayers.slice();

    const p =
      M4.players[id];

    if (
      p &&
      p.entity
    ) {
      p.entity.remove();
    }

    delete M4.players[id];

    m4Save();

    m4msg(
      "🚫 Player blocked."
    );

    sendPacket(
      "block_player",
      {
        targetId: id
      }
    );
  }

  function unblockPlayer(id) {
    M4.blockedPlayers =
      M4.blockedPlayers.filter(
        x => x !== id
      );

    m4Save();

    m4msg(
      "✅ Player unblocked."
    );
  }

  function mutePlayer(id) {
    if (!id) return;

    if (

    reason

    if (!id) return;

    const allowed = [
      "spam",
      "harassment",
      "inappropriate",
      "cheating",
      "other"
    ];

    const cleanReason =
      allowed.includes(reason)
        ? reason

        M4.playerId,
      target: id,
      reason:
        cleanReason,
      time:
        new Date().toISOString(),
      room:
        M4.roomCode

    M4.reports.push(report);

    sendPacket(
      "report",

     --------------------------------------------------------- */

  M4.voice = {
    active: false,
    stream: null,
    peerConnections: {},
    localAudio: null
  };

  async function enableVoice() {
    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {
      m4msg(
        "🎙️ Microphone unavailable."
      );

      return false;
    }

    try {
      const stream =
        await navigator.mediaDevices
          .getUserMedia({
            audio: true
          });

      M4.voice.stream =
        stream;

      M4.voice.active =
        true;

      M4.settings.voiceEnabled =
        true;

      m4Save();

      m4msg(
        "🎙️ Voice enabled."
      );

      sendPacket(
        "voice_ready",
        {}
      );

      return true;
    } catch (e) {
      console.warn(
        "Microphone permission",
        e
      );

      m4msg(
        "🎙️ Microphone permission denied."
      );

      return false;
    }
  }

  function disableVoice() {
    if (
      M4.voice.stream
    ) {
      M4.voice.stream
        .getTracks()
        .forEach(
          track =>
            track.stop()
        );
    }

    M4.voice.stream =
      null;

    M4.voice.active =
      false;

    M4.settings.voiceEnabled =
      false;

    m4Save();

    m4msg(
      "🔇 Voice disabled."
    );
  }

  /* ---------------------------------------------------------
     WEBRTC PEER FOUNDATION
     --------------------------------------------------------- */

  async function createVoicePeer(
    playerId,
    initiator
  ) {
    if (
      typeof RTCPeerConnection ===
      "undefined"
    ) {
      return null;
    }

    const peer =
      new RTCPeerConnection({
        iceServers: [
          {
            urls:
              "stun:stun.l.google.com:19302"
          }
        ]
      });

    M4.voice.peerConnections[
      playerId
    ] = peer;

    if (
      M4.voice.stream
    ) {
      M4.voice.stream
        .getTracks()
        .forEach(
          track => {
            peer.addTrack(
              track,
              M4.voice.stream
            );
          }
        );
    }

    peer.onicecandidate =
      event => {
        if (
          event.candidate
        ) {
          sendPacket(
            "voice_ice",
            {
              targetId:
                playerId,
              candidate:
                event.candidate
            }
          );
        }
      };

    peer.ontrack =
      event => {
        const audio =
          document.createElement(
            "audio"
          );

        audio.autoplay = true;
        audio.playsInline = true;

        audio.srcObject =
          event.streams[0];

        audio.dataset.voicePlayer =
          playerId;

        document.body.appendChild(
          audio
        );
      };

    if (initiator) {
      const offer =
        await peer.createOffer();

      await peer.setLocalDescription(
        offer
      );

      sendPacket(
        "voice_offer",
        {
          targetId:
            playerId,
          offer
        }
      );
    }

    return peer;
  }

  function getWeekNumber() {
    return Math.floor(
      Date.now() /
      (
        7 *
        24 *
        60 *
        60 *
        1000
      )
    );
  }

  function rotateShop() {
    const week =
      getWeekNumber();

    if (
      M5.shop.week === week &&
      M5.shop.items.length
    ) {
      return;
    }

    const shuffled =
      SHOP_ITEMS
        .map(item => ({
          item,
          sort: Math.random()
        }))
        .sort(
          (a, b) =>
            a.sort - b.sort
        )
        .map(
          x => x.item
        );

    M5.shop.week = week;

    M5.shop.items =
      shuffled.slice(0, 6);

    M5.shop.lastRotation =
      Date.now();

    save5();
  }

  function buyItem(id) {
    const item =
      SHOP_ITEMS.find(
        x => x.id === id
      );

    if (!item) return;

    if (
      M5.inventory.includes(id)
    ) {
      notify(
        "✅ You already own this."
      );

      return;
    }

    if (
      !M5.shop.items.some(
        x => x.id === id
      )
    ) {
      notify(
        "This item isn't in this week's shop."
      );

      return;
    }

    if (
      !spendCoins(
        item.price
      )
    ) {
      return;
    }

    M5.inventory.push(id);

    M5.stats.cosmeticsBought++;

    notify(
      "🎁 Bought " +
      item.name +
      "!"
    );

    save5();
  }

    M5.equipped[
      item.type

  function claimDailyReward() {
    const key =
      "monkeyVR_daily_reward";

    const today =
      new Date()
        .toISOString()
        .slice(0, 10);

    if (
      localStorage.getItem(
        key
      ) === today
    ) {
      notify(
        "⏳ Daily reward already claimed."
      );

      return;
    }

    localStorage.setItem(
      key,
      today
    );

    addCoins(
      100,
      "Daily reward"
    );

    if (

      "function"
    ) {
      addXP(
        50,

  function getChallengeProgress(
    challenge
  ) {
    switch (
      challenge.type
    ) {
      case "jumps":
        return getStat(
          "jumps"
        );

      case "builds":
        return getStat(
          "objectsBuilt"
        );

      case "maps":
        return getVisitedMaps();

      case "collectibles":
        return getStat(
          "secretsFound"
        );

      case "sessions":
        return M5.stats.sessions;

      case "events":
        return getStat(
          "eventsSurvived"
        );

      default:
        return 0;
    }
  }

  function getStat(name) {
    if (
      typeof M3 !==
      "undefined" &&
      M3.stats &&
      typeof M3.stats[name] ===
        "number"
    ) {
      return M3.stats[name];
    }

    return 0;
  }

  function getVisitedMaps() {
    try {
      return JSON.parse(
        localStorage.getItem(
          "monkeyVR_visited_maps"
        ) || "[]"
      ).length;
    } catch (err) {
      return 0;
    }
  }

  function checkChallenges() {
    CHALLENGE_LIST
      .forEach(challenge => {
        if (
          M5.challenges.completed[
            challenge.id
          ]
        ) {
          return;
        }

        const progress =
          getChallengeProgress(
            challenge
          );

        if (
          progress >=
          challenge.goal
        ) {
          completeChallenge(
            challenge
          );
        }
      });
  }

  function completeChallenge(
    challenge
  ) {
    if (
      M5.challenges.completed[
        challenge.id
      ]
    ) return;

    M5.challenges.completed[
      challenge.id
    ] = true;

    M5.stats.challengesCompleted++;

    addCoins(
      challenge.reward,
      "Challenge"
    );

    if (
      typeof addXP ===
      "function"
    ) {
      addXP(
        challenge.reward,
        challenge.name
      );
    }

    notify(
      "🏆 Challenge complete: " +
      challenge.name
    );

    save5();
  }

  function setSetting(
    name,
    value
  ) {
    if (
      !Object.prototype
        .hasOwnProperty.call(
          M5.settings,
          name
        )
    ) {
      return;
    }

    M5.settings[name] =
      value;

    applySetting(
      name,
      value
    );

    save5();
  }

  function applySetting(
    name,
    value
  ) {
    if (
      name ===
      "uiScale"
    ) {
      document.documentElement
        .style
        .setProperty(
          "--m5-ui-scale",
          String(value)
        );
    }

    if (
      name ===
      "weather"
    ) {
      document
        .querySelectorAll(
          ".weather-particle"
        )
        .forEach(
          x =>
            x.setAttribute(
              "visible",
              value
            )
        );
    }

    if (
      name ===
      "particles"
    ) {
      document
        .querySelectorAll(
          ".m3-cosmetic-effect"
        )
        .forEach(
          x =>
            x.setAttribute(
              "visible",
              value
            )
        );
    }

    if (
      name ===
      "names"
    ) {
      document
        .querySelectorAll(
          ".m4-player-name"
        )
        .forEach(
          x =>
            x.setAttribute(
              "visible",
              value
            )
        );
    }

    if (
      name ===
      "fpsMode"
    ) {
      if (
        typeof setPerformanceMode ===
        "function"
      ) {
        try {
          setPerformanceMode(
            value ===
              "low"
              ? "low"
              : "normal"
          );
        } catch (err) {}
      }
    }
  }

  /* ---------------------------------------------------------
     ESCAPE HTML
     --------------------------------------------------------- */

  function escapeHTML(value) {
    return String(
      value ?? ""
    )
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );
  }

  /* ---------------------------------------------------------
     KEYBOARD SHORTCUT
     --------------------------------------------------------- */

  window.addEventListener(
    "keydown",
    event => {
      if (
        event.repeat
      ) return;

      if (
        event.key ===
        "Escape"
      ) {
        closeMainUI();
      }

      if (
        event.key.toLowerCase() ===
        "m"
      ) {
        const panel =
          e("m5-window");

        if (
          panel &&
          panel.style.display !==
            "none"
        ) {
          closeMainUI();
        } else {
          openMainUI();
        }
      }
    }
  );

  /* ---------------------------------------------------------
     GAMEPAD SUPPORT
     --------------------------------------------------------- */

  function updateGamepads() {
    if (
      !navigator.getGamepads
    ) return;

    const pads =
      navigator.getGamepads();

    for (
      let i = 0;
      i < pads.length;
      i++
    ) {
      const pad =
        pads[i];

      if (!pad) continue;

      /*
       * This intentionally only detects
       * the controller. It does not interfere
       * with the existing movement system.
       */

      M5.gamepadConnected =
        true;
    }
  }

    const dx =

    const dy =

    const dz =
      a.z - b.z;

    return Math.sqrt(

      dy * dy +

    );

        y: p.y,
        z: p.z
      };
    }

    if (object.position) {
      return {
        x: object.position.x,
        y: object.position.y,
        z: object.position.z
      };
    }

    return {
      x: 0,
      y: 0,
      z: 0
    };
  }

    object.setAttribute(

      Number(x) || 0;

    M6.player.velocity.y +=
      Number(y) || 0;

    M6.player.velocity.z +=
      Number(z) || 0;
  }

  function setVelocity(
    x,
    y,
    z
  ) {
    M6.player.velocity.x =
      Number(x) || 0;

    M6.player.velocity.y =
      Number(y) || 0;

    M6.player.velocity.z =
      Number(z) || 0;
  }

  function dampVelocity(
    amount
  ) {
    amount =
      clamp(
        Number(amount) || 0,
        0,
        1
      );

    M6.player.velocity.x *=
      amount;

    M6.player.velocity.y *=
      amount;

    M6.player.velocity.z *=
      amount;
  }

  /* ========================================================
     ADVANCED JUMP
     ======================================================== */

  function jump() {
    const now =
      performance.now();

    if (
      now -
        M6.player.lastJump <
      150
    ) {
      return false;
    }

    if (
      M6.player.swimming
    ) {
      swimBoost();
      return true;
    }

    if (
      M6.player.grounded
    ) {
      M6.player.velocity.y =
        M6.movement.jumpStrength;

      M6.player.jumpsLeft =
        M6.movement.doubleJumpCount;

      M6.player.lastJump =
        now;

      comboAction("jump");

      return true;
    }

    if (
      M6.movement.doubleJump &&
      M6.player.jumpsLeft > 0
    ) {
      M6.player.velocity.y =
        M6.movement.jumpStrength;

      M6.player.jumpsLeft--;

      M6.player.lastJump =
        now;

      comboAction(
        "double jump"
      );

      return true;
    }

    return false;
  }

  /* ========================================================
     DASH
     ======================================================== */

  function dash() {
    const now =
      performance.now();

    if (
      now -
        M6.player.lastDash <
      M6.movement.dashCooldown
    ) {
      return false;
    }

    const direction =
      forwardVector();

    addVelocity(
      direction.x *
        M6.movement.dashPower,
      0.3,
      direction.z *
        M6.movement.dashPower
    );

    M6.player.lastDash =
      now;

    comboAction("dash");

    msg6("💨 DASH!");

    return true;

  /* ========================================================
     WALL DETECTION
     ======================================================== */

  function findNearbyWall() {
    const p =
      playerPosition();

    const objects =
      document.querySelectorAll(
        "[data-wall], .wall, [wall]"
      );

    let closest =
      null;

    let closestDistance =
      Infinity;

    objects.forEach(
      object => {
        const pos =
          getPosition(object);

        const d =
          distance(
            p,
            pos
          );

        if (
          d <
            closestDistance &&
          d <
            2.5
        ) {
          closest =
            object;

          closestDistance =
            d;
        }
      }
    );

    return closest;
  }

     WALL CLIMB

    if (
      !M6.movement.wallClimb
    ) {
      return false;

    const wall =
      findNearbyWall();

    if (!wall) {

    }

    M6.player.climbing =

  function climb(amount) {

      !M6.player.climbing

    const r =
      rig();

    if (!r) return;

    const p =
      getPosition(r);

    p.y +=
      amount *
      M6.movement.climbSpeed;

    setPosition(
      r,
      p

    M6.player.velocity.y =

  /* ========================================================
     GRAPPLE POINTS
     ======================================================== */

  function createGrapplePoint(
    position,
    options = {}
  ) {
    const s =
      scene();

    if (!s) return null;

    const point =
      document.createElement(
        "a-entity"
      );

    const p = {
      x:
        Number(position.x) || 0,
      y:
        Number(position.y) || 0,
      z:
        Number(position.z) || 0
    };

    point.setAttribute(
      "position",
      `${p.x} ${p.y} ${p.z}`
    );

    point.setAttribute(
      "geometry",
      "primitive: sphere; radius: .14"
    );

    point.setAttribute(
      "material",
      "color: #ffffff; emissive: #ffffff; emissiveIntensity: 1"
    );

    point.setAttribute(
      "data-grapple",
      "true"
    );

    point.dataset.grappleId =
      "grapple_" +
      Date.now() +
      "_" +
      Math.random()
        .toString(36)
        .slice(2);

    s.appendChild(
      point
    );

    const data = {
      id:
        point.dataset.grappleId,
      entity: point,
      position: p,
      range:
        options.range ||
        M6.grapple.maxDistance
    };

    M6.objects.grapples.push(
      data
    );

    return data;
  }

  function findNearestGrapple() {
    const p =
      playerPosition();

    let best =
      null;

    let bestDistance =
      Infinity;

    M6.objects.grapples
      .forEach(
        grapple => {
          const d =
            distance(
              p,
              grapple.position
            );

          if (
            d <
              bestDistance &&
            d <=
              grapple.range
          ) {
            best =
              grapple;

            bestDistance =
              d;
          }
        }
      );

    return best;
  }

  function grapple() {
    if (
      M6.grapple.active
    ) {
      releaseGrapple();
      return;
    }

    const target =
      findNearestGrapple();

    if (!target) {
      msg6(
        "🪝 No grapple point nearby."
      );
      return;
    }

    M6.grapple.active =
      true;

    M6.grapple.target =
      target;

    M6.grapple.point =
      target.position;

    msg6(
      "🪝 GRAPPLE!"
    );

    comboAction(
      "grapple"
    );
  }

  function releaseGrapple() {
    M6.grapple.active =
      false;

    M6.grapple.target =
      null;

    M6.grapple.point =
      null;
  }

  function updateGrapple(
    dt
  ) {
    if (
      !M6.grapple.active ||
      !M6.grapple.point
    ) {
      return;
    }

    const p =
      playerPosition();

    const target =
      M6.grapple.point;

    const dx =
      target.x - p.x;

    const dy =
      target.y - p.y;

    const dz =
      target.z - p.z;

    const len =
      Math.sqrt(
        dx * dx +
        dy * dy +
        dz * dz
      );

    if (
      len < 1.4
    ) {
      releaseGrapple();
      return;
    }

    const nx =
      dx / len;

    const ny =
      dy / len;

    const nz =
      dz / len;

    const force =
      M6.grapple.pullStrength *
      dt;

    addVelocity(
      nx * force,
      ny * force,
      nz * force
    );
  }

     ZIPLINES

  function createZipline(

    end

    if (!s) return null;

      `

    line.setAttribute(
      "data-zipline",
      "true"
    );

    s.appendChild(
      line
    );

    const data = {
      entity: line,
      start,
      end
    };

    M6.objects.ziplines.push(
      data
    );

    return data;
  }

  function nearestZipline() {
    const p =
      playerPosition();

    let best =
      null;

    let bestDistance =
      Infinity;

    M6.objects.ziplines
      .forEach(
        line => {
          const d =
            distance(
              p,
              line.start
            );

          if (
            d <
              bestDistance &&
            d <
              3
          ) {
            best =
              line;

            bestDistance =
              d;
          }
        }
      );

    return best;
  }

  function rideZipline() {
    if (
      M6.zipline.active
    ) {
      M6.zipline.active =
        false;

      M6.zipline.target =
        null;

      return;
    }

    const line =
      nearestZipline();

    if (!line) {
      msg6(
        "🚡 No zipline nearby."
      );
      return;
    }

    M6.zipline.active =
      true;

    M6.zipline.target =
      line;

    msg6(
      "🚡 ZIPLINE!"
    );

    comboAction(
      "zipline"
    );
  }

  function updateZipline(
    dt
  ) {
    if (
      !M6.zipline.active ||
      !M6.zipline.target
    ) {
      return;
    }

    const line =
      M6.zipline.target;

    const p =
      playerPosition();

    const dx =
      line.end.x -
      p.x;

    const dy =
      line.end.y -
      p.y;

    const dz =
      line.end.z -
      p.z;

    const len =
      Math.sqrt(
        dx * dx +
        dy * dy +
        dz * dz
      );

    if (
      len < 1
    ) {
      M6.zipline.active =
        false;

      M6.zipline.target =
        null;

      return;
    }

    addVelocity(
      dx / len *
        M6.zipline.speed *
        dt,
      dy / len *
        M6.zipline.speed *
        dt,
      dz / len *
        M6.zipline.speed *
        dt
    );
  }

  function updateSwimming() {
    const p =
      playerPosition();

    let inside =
      false;

    M6.objects.water
      .forEach(
        water => {
          const x =
            Math.abs(
              p.x -
              water.position.x
            );

          const z =
            Math.abs(
              p.z -
              water.position.z
            );

          const y =
            p.y <=
              water.position.y +
                water.height / 2 &&
            p.y >=
              water.position.y -
                water.height / 2;

          if (
            x <
              water.width / 2 &&
            z <
              water.depth / 2 &&
            y
          ) {
            inside =
              true;
          }
        }
      );

    if (
      inside !==
      M6.player.swimming
    ) {
      M6.player.swimming =
        inside;

      msg6(
        inside
          ? "🌊 Swimming"
          : "🏝️ Out of water"
      );
    }
  }

  function swimBoost() {
    M6.player.velocity.y =
      M6.swimming.buoyancy;

    const direction =
      forwardVector();

    addVelocity(
      direction.x *
        M6.swimming.swimSpeed,
      0,
      direction.z *
        M6.swimming.swimSpeed
    );

    comboAction(
      "swim"
    );
  }

  /* ========================================================
     POWER SYSTEM
     ======================================================== */

  function usePower(name) {
    if (
      !M6.powers.list.includes(
        name
      )
    ) {
      return false;
    }

    const now =
      Date.now();

    const cooldown =
      M6.powers.cooldowns[
        name
      ] || 0;

    if (
      now < cooldown
    ) {
      msg6(
        "⏳ Power cooling down."
      );
      return false;
    }

    M6.powers.active =
      name;

    switch (name) {

      case "Super Jump":
        M6.player.velocity.y =
          9;

        setPowerCooldown(
          name,
          2500
        );

        break;

      case "Speed Burst":
        addVelocity(
          forwardVector().x * 8,
          0,
          forwardVector().z * 8
        );

        setPowerCooldown(
          name,
          3000
        );

        break;

      case "Shockwave":
        if (
          typeof shockwave ===
          "function"
        ) {
          shockwave();
        }

        setPowerCooldown(
          name,
          3500
        );

        break;

      case "Blink":
        blinkForward(
          7
        );

        setPowerCooldown(
          name,
          2500
        );

        break;

      case "Moon Jump":
        M6.player.velocity.y =
          7;

        setGravityMultiplier(
          0.25
        );

        setTimeout(
          () => {
            setGravityMultiplier(
              1
            );
          },
          5000
        );

        setPowerCooldown(
          name,
          7000
        );

        break;

      case "Giant":
        setPlayerScale(
          2.2
        );

        setPowerCooldown(
          name,
          10000
        );

        setTimeout(
          () =>
            setPlayerScale(
              1
            ),
          8000
        );

        break;

      case "Tiny":
        setPlayerScale(
          0.45
        );

        setPowerCooldown(
          name,
          10000
        );

        setTimeout(
          () =>
            setPlayerScale(
              1
            ),
          8000
        );

        break;

      case "Magnet Hands":
        magnetHands();

        setPowerCooldown(
          name,
          5000
        );

        break;

      case "Time Slow":
        setTimeScale(
          0.35
        );

        setTimeout(
          () =>
            setTimeScale(
              1
            ),
          5000
        );

        setPowerCooldown(
          name,
          9000
        );

        break;

      case "Gravity Flip":
        setGravityMultiplier(
          -1
        );

        setTimeout(
          () =>
            setGravityMultiplier(
              1
            ),
          4000
        );

        setPowerCooldown(
          name,
          8000
        );

        break;

      case "Dash":
        dash();

        setPowerCooldown(
          name,
          1800
        );

        break;

      case "Random Power":
        const random =
          M6.powers.list[
            Math.floor(
              Math.random() *
              (
                M6.powers.list.length -
                1
              )
            )
          ];

        if (
          random !==
          "Random Power"
        ) {
          usePower(
            random
          );
        }

        return true;
    }

    msg6(
      "⚡ " +
      name +
      "!"
    );

    comboAction(
      "power"
    );

    return true;
  }

  function setPowerCooldown(
    name,
    milliseconds
  ) {
    M6.powers.cooldowns[
      name
    ] =
      Date.now() +
      milliseconds;
  }

    if (!r) return;

    const p =

      f.x * amount;

    p.z +=
      f.z * amount;

    setPosition(
      r,
      p
    );
  }

      `${scale} ${scale} ${scale}`
    );

  function magnetHands() {
    const objects =
      document.querySelectorAll(
        "[grabbable], .grabbable, [data-grabbable]"
      );

    const p =
      playerPosition();

    objects.forEach(
      object => {
        const pos =
          getPosition(object);

        const d =
          distance(
            p,
            pos
          );

        if (
          d < 12
        ) {
          const dx =
            p.x - pos.x;

          const dy =
            p.y - pos.y;

          const dz =
            p.z - pos.z;

          setPosition(
            object,
            {
              x:
                pos.x +
                dx * 0.08,

              y:
                pos.y +
                dy * 0.08,

              z:
                pos.z +
                dz * 0.08
            }
          );
        }
      }
    );
  }

  /* ========================================================
     NPC SYSTEM
     ======================================================== */

  function spawnAdvancedNPC(
    type = "training",
    position = null,
    options = {}
  ) {
    if (
      M6.npc.list.length >=
      M6.npc.max
    ) {

        "NPC limit reached."
      );
      return null;
    }

    const s =

    if (!s) return null;

    const npc =
      document.createElement(

      );
